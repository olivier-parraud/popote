 "Ajoute les lardons et l'oignon émincé, et poursuis 5 minutes.",
 "Bats les œufs avec le persil, poivre et très peu de sel.",
 "Verse les œufs sur la garniture, baisse le feu et couvre. Laisse cuire 5 à 6 minutes sans remuer.",
 "L'omelette est prête quand le dessus est pris. Fais-la glisser sur une assiette et coupe-la en parts."
],["Couvrir la poêle permet de cuire le dessus sans avoir à retourner l'omelette."],"1 jour au frigo ; elle se mange aussi froide.");
X("soupe-legumes","Un grand faitout, un éplucheur, un mixeur plongeant.",[
 "Épluche les carottes et les pommes de terre. Coupe le vert et la racine du poireau, fends-le et rince-le bien.",
 "Coupe tous les légumes en morceaux d'environ 2 cm : de même taille, ils cuisent en même temps.",
 "Mets-les dans le faitout avec le cube de bouillon émietté et couvre d'eau à hauteur, pas plus : une soupe trop liquide manque de goût.",
 "Porte à ébullition, puis baisse le feu, couvre et laisse cuire 25 minutes. Les légumes doivent s'écraser facilement.",
 "Mixe longuement, au moins 1 minute, pour obtenir une soupe bien lisse. Ajoute un peu d'eau chaude si elle est trop épaisse.",
 "Ajoute la crème, goûte, sale et poivre. Sers avec du pain grillé."
],["Fais revenir les légumes 5 minutes dans un peu de beurre avant d'ajouter l'eau : la soupe aura bien plus de goût.","Les fanes de carottes ou les restes de légumes du frigo y ont toute leur place."],"4 jours au frigo, 3 mois au congélateur en portions.");
X("veloute-potiron","Un faitout, un grand couteau, un mixeur plongeant.",[
 "Coupe la courge en deux avec un grand couteau, retire les graines à la cuillère, puis épluche-la avec un éplucheur et coupe-la en cubes.",
 "Épluche la pomme de terre et coupe-la en cubes. Émince l'oignon.",
 "Fais revenir l'oignon 3 minutes dans un filet d'huile au fond du faitout, sans colorer.",
 "Ajoute la courge et la pomme de terre, mélange 2 minutes, puis le bouillon émietté et de l'eau juste à hauteur.",
 "Couvre et laisse cuire 20 à 25 minutes, jusqu'à ce que la courge soit fondante.",
 "Mixe avec la crème et une pincée de muscade jusqu'à ce que ce soit velouté. Sale, poivre.",
 "Sers bien chaud avec du pain grillé."
],["La butternut s'épluche bien plus facilement que le potimarron… mais le potimarron se mange avec sa peau, pas besoin de l'éplucher.","Quelques graines de courge grillées à la poêle font un joli croquant."],"4 jours au frigo, 3 mois au congélateur.");
X("steak-frites","Une plaque de four, une poêle épaisse, une pince ou une spatule.",[
 "Préchauffe le four à la température indiquée sur le sachet de frites (souvent 220 °C). Étale les frites en une seule couche sur la plaque et enfourne pour environ 20 minutes, en les retournant à mi-cuisson.",
 "Sors la viande du frigo 15 minutes avant de la cuire.",
 "Façonne un steak d'environ 2 cm d'épaisseur sans trop tasser la viande, avec un petit creux au centre (il évite qu'il gonfle).",
 "Chauffe la poêle à feu vif avec un filet d'huile. Elle doit être très chaude.",
 "Pose le steak et n'y touche plus pendant 2 à 3 minutes, jusqu'à ce qu'une croûte se forme. Retourne-le une seule fois.",
 "Compte 2 minutes de l'autre côté pour saignant, 3 pour à point. Sale et poivre seulement à la fin.",
 "Pendant ce temps, assaisonne la salade. Sers le steak avec les frites salées à la sortie du four."
],["Ne presse jamais le steak dans la poêle : tu en fais sortir tout le jus."],"À manger tout de suite.");
X("escalope-creme","Une poêle ou sauteuse, une casserole pour le riz.",[
 "Lance la cuisson du riz.",
 "Nettoie les champignons avec un essuie-tout humide (ne les fais pas tremper) et émince-les. Hache l'échalote.",
 "Sèche les escalopes, sale et poivre-les.",
 "Fais fondre le beurre dans la poêle à feu moyen à vif. Quand il mousse, dépose les escalopes et fais-les dorer 3 à 4 minutes de chaque côté. Réserve-les sur une assiette sous une feuille d'aluminium.",
 "Dans la même poêle, sans la laver, fais revenir l'échalote 1 minute, puis les champignons 5 à 6 minutes, jusqu'à ce qu'ils aient rendu leur eau et commencent à dorer.",
 "Verse la crème, mélange en grattant les sucs du fond, et laisse épaissir 2 minutes.",
 "Remets les escalopes et leur jus dans la sauce 1 minute pour les réchauffer. Sers avec le riz."
],["Les sucs de cuisson de la viande au fond de la poêle donnent tout son goût à la sauce : ne les jette pas."],"2 jours au frigo.");
X("poulet-moutarde","Une poêle avec couvercle, une casserole.",[
 "Porte une casserole d'eau salée à ébullition et fais-y cuire les haricots verts 8 à 10 minutes. Ils doivent rester légèrement croquants. Égoutte.",
 "Coupe le poulet en morceaux de 3 cm. Sale et poivre.",
 "Chauffe l'huile dans la poêle à feu moyen à vif et fais dorer le poulet 5 à 6 minutes, en le retournant.",
 "Baisse le feu, ajoute la moutarde et la crème, et mélange bien.",
 "Laisse mijoter 3 minutes à couvert, jusqu'à ce que la sauce nappe le poulet et que la viande soit cuite à cœur (plus du tout rosée à l'intérieur).",
 "Sers avec les haricots verts, éventuellement passés 1 minute dans la sauce."
],["La moutarde à l'ancienne, en grains, donne une sauce plus rustique.","Ne fais pas bouillir fort après la moutarde : elle devient amère."],"2 jours au frigo.");
X("gratin-courgettes","Une poêle, un plat à gratin, un bol, une casserole pour le riz.",[
 "Préchauffe le four à 200 °C et lance le riz.",
 "Lave les courgettes, coupe les extrémités et taille-les en rondelles de 5 mm.",
 "Chauffe l'huile d'olive dans la poêle à feu moyen. Fais revenir les courgettes avec l'ail haché 8 à 10 minutes : elles doivent rendre leur eau et légèrement dorer. Sale.",
 "Égoutte-les bien dans une passoire 2 minutes : c'est l'eau des courgettes qui rend un gratin liquide.",
 "Bats l'œuf avec la crème, sel et poivre.",
 "Étale les courgettes dans le plat, verse l'appareil et parsème de fromage.",
 "Enfourne 20 à 25 minutes, jusqu'à ce que le dessus soit doré et que l'appareil soit pris. Sers avec le riz."
],["Quelques feuilles de basilic ou une pincée de thym dans l'appareil lui donnent un air de Provence."],"3 jours au frigo.");
X("ratatouille","Un grand faitout ou une cocotte, une planche, un bon couteau.",[
 "Lave tous les légumes. Coupe l'aubergine, les courgettes et le poivron en dés d'environ 2 cm. Émince l'oignon et hache l'ail. Coupe les tomates en morceaux.",
 "Chauffe la moitié de l'huile dans le faitout à feu moyen. Fais revenir l'oignon et le poivron 5 minutes.",
 "Ajoute l'aubergine avec le reste d'huile (elle en absorbe beaucoup) et fais-la revenir 5 minutes en remuant.",
 "Ajoute les courgettes et l'ail, et poursuis 5 minutes.",
 "Ajoute les tomates, les herbes de Provence, du sel et du poivre. Mélange.",
 "Couvre et laisse mijoter 35 minutes à feu doux, en remuant de temps en temps. Retire le couvercle les 10 dernières minutes si c'est trop liquide.",
 "Pendant ce temps, fais cuire le riz. Goûte la ratatouille, rectifie l'assaisonnement et sers."
],["La ratatouille est encore meilleure le lendemain, et elle se mange chaude, tiède ou froide.","Fais-en le double : elle se congèle très bien."],"4 jours au frigo, 3 mois au congélateur.");

X("endives-jambon","Une casserole, une passoire, une petite casserole pour la sauce, un fouet, un plat à gratin.",[
 "Retire les premières feuilles abîmées des endives et creuse un petit cône à la base avec la pointe d'un couteau : c'est la partie la plus amère.",
 "Plonge-les dans l'eau bouillante salée avec un trait de jus de citron si tu en as, et cuis 15 minutes.",
 "Égoutte-les la tête en bas, puis presse-les doucement dans un torchon : elles retiennent beaucoup d'eau.",
 "Préchauffe le four à 200 °C.",
 "Béchamel : fais fondre le beurre dans la petite casserole, ajoute la farine et remue 1 minute à feu moyen. Verse le lait froid d'un coup en fouettant sans arrêt, jusqu'à ce que la sauce épaississe (3 à 4 minutes). Sale, poivre, ajoute la muscade.",
 "Roule chaque endive dans une tranche de jambon et range-les serrées dans le plat beurré.",
 "Nappe de béchamel, parsème de fromage et enfourne 20 minutes, jusqu'à ce que ce soit bien gratiné."
],["Une pincée de sucre dans l'eau de cuisson adoucit l'amertume des endives."],"3 jours au frigo.");
X("coquillettes-jambon","Une casserole, une passoire.",[
 "Porte un grand volume d'eau à ébullition et sale-la.",
 "Verse les coquillettes et cuis-les le temps indiqué sur le paquet, en remuant au début pour qu'elles ne collent pas.",
 "Pendant ce temps, coupe le jambon en petits carrés.",
 "Garde une demi-tasse d'eau de cuisson, puis égoutte les pâtes.",
 "Remets-les dans la casserole chaude, hors du feu, avec le beurre, le jambon et le fromage. Mélange vivement : le fromage fond et file.",
 "Si c'est un peu sec, ajoute une ou deux cuillères d'eau de cuisson. Poivre et sers aussitôt."
],["Le plat réconfort par excellence : une cuillère de crème le rend encore plus gourmand."],"2 jours au frigo ; réchauffe avec un trait d'eau.");
X("saumon-papillote","Une plaque, du papier cuisson, une poêle, une casserole pour le riz.",[
 "Préchauffe le four à 200 °C et lance la cuisson du riz.",
 "Nettoie le poireau, coupe-le en fines rondelles et fais-le fondre 5 minutes dans le beurre à feu doux, avec une pincée de sel.",
 "Découpe une grande feuille de papier cuisson pour chaque personne.",
 "Au centre, dépose un lit de poireaux, puis le pavé de saumon, peau dessous. Sale, poivre.",
 "Ajoute une cuillère de crème et une rondelle de citron sur le poisson.",
 "Referme la papillote en rabattant les bords et en les pliant plusieurs fois sur eux-mêmes : elle doit être bien étanche pour que le poisson cuise dans sa vapeur.",
 "Enfourne 15 minutes. Ouvre la papillote à table, attention à la vapeur chaude, et sers avec le riz."
],["Le saumon est parfait quand le centre est encore légèrement rosé : il se défait en lamelles nacrées."],"1 jour au frigo.");
X("colin-citron","Une casserole ou un panier vapeur, une poêle antiadhésive, une spatule souple.",[
 "Épluche les pommes de terre, coupe-les en deux si elles sont grosses, et cuis-les 20 minutes à l'eau salée ou à la vapeur.",
 "Si le colin est surgelé, fais-le décongeler la veille au frigo, ou 1 heure dans un sac fermé plongé dans l'eau froide. Sèche-le bien avec un essuie-tout.",
 "Sale et poivre les filets. Chauffe la moitié du beurre dans la poêle à feu moyen.",
 "Fais cuire le poisson 3 à 4 minutes de chaque côté, en le retournant une seule fois et délicatement : il est fragile. Il est cuit quand la chair devient blanche et se détache en feuillets.",
 "Dépose le poisson dans l'assiette. Ajoute le reste du beurre dans la poêle, laisse-le mousser et prendre une couleur noisette, puis le jus de citron et le persil haché.",
 "Verse ce beurre citronné bien chaud sur le poisson et les pommes de terre."
],["Un poisson bien sec avant cuisson dore au lieu de bouillir."],"1 jour au frigo.");
X("parmentier-poisson","Une casserole, une sauteuse, un presse-purée, un plat à gratin.",[
 "Épluche et coupe les pommes de terre, puis cuis-les 20 minutes à l'eau salée.",
 "Dans une sauteuse, porte de l'eau à frémissement (sans bouillir) et fais pocher le poisson 8 minutes.",
 "Égoutte-le et émiette-le à la fourchette en retirant les éventuelles arêtes. Mélange-le avec l'ail haché, le persil et un filet d'huile d'olive.",
 "Préchauffe le four à 210 °C.",
 "Prépare la purée : écrase les pommes de terre avec le beurre et le lait chaud. Sale et poivre.",
 "Étale le poisson dans le plat, couvre de purée, parsème de fromage.",
 "Enfourne 15 à 20 minutes, jusqu'à ce que le dessus soit doré."
],["Un peu de zeste de citron dans la purée se marie très bien avec le poisson."],"2 jours au frigo.");
X("moules-frites","Une grande cocotte avec couvercle, une plaque de four, une passoire.",[
 "Préchauffe le four pour les frites et enfourne-les dès qu'il est chaud (environ 20 minutes).",
 "Rince les moules dans une passoire sous l'eau froide. Gratte les impuretés et tire sur le petit filament (la barbe) pour l'arracher.",
 "Jette les moules cassées et celles qui restent ouvertes quand tu tapes dessus : elles ne sont plus bonnes.",
 "Hache l'échalote et le persil.",
 "Dans la cocotte, fais fondre le beurre à feu moyen et fais revenir l'échalote 2 minutes.",
 "Monte le feu au maximum, verse les moules et couvre. Laisse cuire 6 à 8 minutes en secouant la cocotte 2 ou 3 fois, couvercle tenu.",
 "Dès que toutes les moules sont ouvertes, ajoute la crème et le persil, mélange et coupe le feu. Jette celles qui sont restées fermées.",
 "Sers dans un grand bol avec le jus, et les frites à côté."
],["Un verre de vin blanc versé avec les moules donne les vraies moules marinières.","Ne sale pas : les moules rendent une eau déjà salée."],"À manger tout de suite.");
X("galette-complete","Un saladier, un fouet, une louche, une grande poêle antiadhésive ou une crêpière.",[
 "Dans le saladier, mets la farine de sarrasin et une pincée de sel. Verse environ 150 ml d'eau froide par personne petit à petit en fouettant.",
 "La pâte doit être lisse et un peu plus épaisse qu'une pâte à crêpes. Laisse-la reposer au moins 30 minutes, idéalement 1 heure.",
 "Chauffe la poêle à feu vif et graisse-la avec un peu de beurre.",
 "Verse une louche de pâte et étale-la vite en inclinant la poêle. Laisse cuire 1 à 2 minutes, jusqu'à ce que les bords se soulèvent.",
 "Retourne la galette et baisse à feu moyen. Parsème de fromage, pose le jambon et casse l'œuf au centre.",
 "Couvre 2 à 3 minutes, le temps que le blanc soit cuit et le jaune encore coulant.",
 "Replie les quatre bords vers le centre pour former un carré, en laissant le jaune visible. Ajoute une noisette de beurre et sers."
],["La pâte à galette s'améliore avec le temps : préparée la veille, elle est encore meilleure."],"La pâte se garde 2 jours au frigo.");
X("poulet-basquaise","Une cocotte avec couvercle, une casserole pour le riz.",[
 "Sale et poivre le poulet. Chauffe l'huile dans la cocotte à feu vif et fais dorer les morceaux côté peau 5 minutes, puis 3 minutes de l'autre côté. Réserve-les.",
 "Coupe les poivrons en lanières et émince l'oignon.",
 "Dans la même cocotte, fais-les revenir 10 minutes à feu moyen, jusqu'à ce qu'ils soient tendres.",
 "Ajoute l'ail haché et le paprika, mélange 30 secondes, puis les tomates.",
 "Remets le poulet en l'enfonçant dans la sauce. Couvre et laisse mijoter 30 minutes à feu doux.",
 "Lance le riz 15 minutes avant la fin.",
 "Si la sauce est trop liquide, retire le couvercle les 10 dernières minutes. Goûte et rectifie."
],["Le piment d'Espelette remplace très bien le paprika : c'est la vraie touche basque."],"3 jours au frigo, 3 mois au congélateur.");
X("soupe-oignon","Une cocotte, des bols allant au four.",[
 "Épluche les oignons, coupe-les en deux puis en lamelles fines.",
 "Fais fondre le beurre dans la cocotte et ajoute les oignons avec une pincée de sel.",
 "Laisse-les cuire 20 à 25 minutes à feu doux, en remuant régulièrement. Ils doivent devenir fondants et prendre une couleur caramel. C'est l'étape qui fait tout le goût, ne la presse pas.",
 "Saupoudre de farine et mélange 1 minute.",
 "Ajoute le bouillon et environ 400 ml d'eau par personne. Porte à ébullition et laisse frémir 15 minutes. Sale, poivre.",
 "Allume le gril du four. Fais griller les tranches de baguette.",
 "Verse la soupe dans les bols, pose les tranches de pain dessus et couvre généreusement de fromage.",
 "Passe sous le gril 3 à 5 minutes, jusqu'à ce que le fromage soit doré et bouillonnant."
],["Si les oignons accrochent, ajoute une cuillère d'eau et gratte le fond : ces sucs donnent la couleur à la soupe."],"La soupe (sans pain ni fromage) se garde 4 jours au frigo.");
X("gratin-chou-fleur","Une casserole, une petite casserole, un fouet, un plat à gratin.",[
 "Détaille le chou-fleur en bouquets de taille égale.",
 "Fais-les cuire 8 à 10 minutes dans l'eau bouillante salée : ils doivent être tendres mais encore fermes. Égoutte très soigneusement.",
 "Préchauffe le four à 200 °C.",
 "Béchamel : fais fondre le beurre, ajoute la farine et remue 1 minute. Verse le lait froid en fouettant jusqu'à épaississement. Ajoute la moitié du fromage, la muscade, sel et poivre.",
 "Dispose le chou-fleur et le jambon en dés dans le plat.",
 "Nappe de béchamel et parsème du reste de fromage.",
 "Enfourne 20 minutes, jusqu'à ce que le dessus soit bien doré."
],["Le chou-fleur mal égoutté rend de l'eau dans le gratin : laisse-le s'égoutter 5 minutes."],"3 jours au frigo.");
X("pdt-oeufs-plat","Une grande poêle, une petite poêle, une spatule.",[
 "Épluche les pommes de terre (ou garde la peau si elles sont nouvelles) et coupe-les en cubes de 2 cm.",
 "Rince-les et sèche-les bien dans un torchon : sèches, elles dorent mieux.",
 "Chauffe l'huile dans la grande poêle à feu moyen à vif. Ajoute les pommes de terre en une seule couche.",
 "Laisse-les dorer 5 minutes sans toucher, puis remue et poursuis 15 minutes en remuant de temps en temps. Elles doivent être croustillantes dehors et tendres dedans.",
 "Sale, poivre et parsème de persil.",
 "Dans la petite poêle, fais cuire les œufs au plat à feu moyen, 2 à 3 minutes, jusqu'à ce que le blanc soit pris et le jaune encore coulant.",
 "Sers avec la salade."
],["Couvrir la poêle 1 minute à la fin cuit le dessus du blanc sans durcir le jaune."],"À manger tout de suite.");
X("cassoulet","Une cocotte avec couvercle.",[
 "Coupe les saucisses en tronçons de 3 cm.",
 "Fais-les dorer avec les lardons dans la cocotte à feu moyen, 5 minutes.",
 "Ajoute l'oignon haché et l'ail, et poursuis 3 minutes.",
 "Rince et égoutte les haricots, puis ajoute-les avec les tomates et le thym.",
 "Ajoute un demi-verre d'eau, couvre et laisse mijoter 25 minutes à feu doux en remuant de temps en temps.",
 "Goûte et poivre. Pour une croûte comme au four, verse dans un plat, saupoudre de chapelure et passe 10 minutes sous le gril."
],["Une cuisse de canard confite en morceaux en fait un vrai cassoulet de fête."],"4 jours au frigo, 3 mois au congélateur.");
X("boeuf-carottes","Une cocotte avec couvercle.",[
 "Coupe la viande en gros cubes et sèche-la.",
 "Fais-la dorer dans un filet d'huile à feu vif, en plusieurs fois, 2 à 3 minutes par face.",
 "Ajoute l'oignon émincé et fais-le revenir 3 minutes à feu moyen.",
 "Ajoute le concentré de tomate, le bouillon, le thym et le laurier, puis de l'eau à hauteur.",
 "Couvre et laisse mijoter 1 h 30 à feu très doux.",
 "Ajoute les carottes en rondelles épaisses et les pommes de terre en morceaux.",
 "Poursuis 40 minutes, jusqu'à ce que la viande soit fondante et les carottes confites. Laisse réduire la sauce à découvert si besoin."
],["Plus la cuisson est douce et longue, plus la viande est tendre."],"4 jours au frigo, 3 mois au congélateur.");
X("saucisse-puree","Une casserole, une poêle avec couvercle, un presse-purée.",[
 "Épluche les pommes de terre, coupe-les en gros morceaux et cuis-les 20 minutes à l'eau salée.",
 "Pique les saucisses. Fais-les cuire dans la poêle à feu moyen, couvercle entrouvert, 15 minutes en les retournant souvent.",
 "À mi-cuisson, ajoute l'oignon émincé autour : il fond dans le jus des saucisses. Ajoute un fond d'eau s'il accroche.",
 "Égoutte les pommes de terre et écrase-les aussitôt avec le beurre.",
 "Ajoute le lait chaud petit à petit jusqu'à la texture voulue. Sale, poivre.",
 "Sers les saucisses et les oignons sur la purée, avec le jus de cuisson."
],["Un peu de moutarde dans la purée, c'est délicieux avec les saucisses."],"2 jours au frigo.");
X("flammekueche","Une plaque de four, du papier cuisson, un bol.",[
 "Préchauffe le four à 240 °C, le plus chaud possible.",
 "Émince l'oignon en lamelles très fines, presque transparentes.",
 "Mélange le fromage blanc et la crème avec du sel, du poivre et une pincée de muscade.",
 "Déroule la pâte sur la plaque et étale-la le plus finement possible au rouleau ou avec les doigts.",
 "Étale le mélange crémeux jusqu'à 1 cm du bord, puis répartis l'oignon et les lardons crus.",
 "Enfourne 12 à 15 minutes, jusqu'à ce que les bords soient bien dorés et croustillants.",
 "Coupe en parts et sers aussitôt."
],["Le secret d'une bonne flammekueche : une pâte très fine et un four très chaud."],"À manger tout de suite.");
X("omelette-champi","Une poêle, une spatule, un bol.",[
 "Nettoie les champignons avec un essuie-tout humide et émince-les.",
 "Fais-les revenir dans la moitié du beurre à feu moyen à vif, 5 minutes, jusqu'à ce qu'ils aient rendu leur eau et commencent à dorer. Sale, poivre, réserve.",
 "Bats les œufs avec le persil, sel et poivre.",
 "Fais fondre le reste du beurre dans la poêle et verse les œufs.",
 "Ramène les bords vers le centre pendant 1 minute, puis répartis les champignons sur une moitié.",
 "Quand le dessus est encore baveux, replie l'omelette et sers avec la salade."
],["Les champignons ne doivent pas être entassés dans la poêle, sinon ils bouillent au lieu de dorer."],"À manger tout de suite.");
X("poelee-pdt-lardons","Une grande poêle avec couvercle.",[
 "Épluche les pommes de terre et coupe-les en cubes de 2 cm. Sèche-les.",
 "Chauffe un filet d'huile à feu moyen et fais dorer les pommes de terre 10 minutes, couvercle posé, en remuant de temps en temps.",
 "Retire le couvercle, ajoute les lardons et l'oignon émincé.",
 "Poursuis 5 minutes, puis ajoute les champignons émincés.",
 "Laisse dorer encore 10 minutes en remuant, jusqu'à ce que tout soit bien doré.",
 "Poivre, goûte avant de saler (les lardons le sont déjà) et parsème de persil."
],["Le couvercle au début cuit les pommes de terre à cœur ; sans couvercle à la fin, elles deviennent croustillantes."],"2 jours au frigo.");
X("tomates-farcies","Un plat à four, une cuillère, un saladier, une casserole pour le riz.",[
 "Préchauffe le four à 180 °C et fais précuire le riz 10 minutes à l'eau salée (il finira de cuire au four).",
 "Coupe un chapeau sur chaque tomate et creuse l'intérieur avec une cuillère. Garde la pulpe.",
 "Sale l'intérieur des tomates et retourne-les sur une assiette 10 minutes pour qu'elles rendent leur eau.",
 "Retire la peau des saucisses et mélange la chair avec l'oignon, l'ail et le persil hachés finement. Poivre.",
 "Remplis les tomates de farce en tassant, saupoudre de chapelure et remets les chapeaux.",
 "Mets le riz précuit et la pulpe de tomate hachée au fond du plat, avec un demi-verre d'eau. Pose les tomates dessus.",
 "Enfourne 45 minutes. Le riz cuit dans le jus des tomates."
],["Le riz cuit sous les tomates absorbe tout le jus : c'est le meilleur du plat."],"3 jours au frigo.");
X("courgettes-farcies","Un plat à four, une cuillère, une poêle, une casserole.",[
 "Préchauffe le four à 190 °C et fais précuire le riz 10 minutes.",
 "Coupe les courgettes en deux dans la longueur et creuse-les avec une cuillère en laissant 5 mm de bord. Hache la chair retirée.",

const KEY = "popote.v1";
let memCopy = null;
const DEFAULT = () => ({

});
function loadState(){

  try { raw = localStorage.getItem(KEY); } catch(e) {}
  if (!raw) raw = memCopy;
  if (!raw) return DEFAULT();
  try { return Object.assign(DEFAULT(), JSON.parse(raw)); } catch(e) { return DEFAULT(); }
}
let S = loadState();
if (!S.cuisV2){ for (const k of NEW_CUISINES) if (!S.cuisines.includes(k)) S.cuisines.push(k); S.cuisV2 = 1; }

/* ════════════ Ingrédients & recettes ════════════ */
let I = {}, IKEYS = [], IIDX = {};
function buildIngredients(){
  I = {};
  const add = (k, a, custom) => { I[k] = {k, n:a[0], u:a[1], size:a[2], price:a[3], r:a[4], fl:a[5]||"", lab:a[6]||"", custom:!!custom}; };
  for (const k in ING) add(k, ING[k]);
  for (const k in S.customIng) add(k, S.customIng[k], true);
  IKEYS = Object.keys(I); IIDX = {}; IKEYS.forEach((k,i) => IIDX[k] = i);
}
let RX = [], RBYID = {};
function mkRecipe(a, custom){
  const [id,n,e,c0,m,d,t,tg,ings,steps] = a;
  const c = !custom && RETAG[id] ? RETAG[id] : c0;
  const i = ings.filter(x => I[x[0]]).map(x => x.slice(0,2));
  if (!custom) addBasics(id, i, tg);
  const F = {};
  for (const [k] of i) for (const ch of I[k].fl) F[ch] = 1;
  let prot = "vege";
  if (F.f || F.c) prot = "poisson";
  else if (i.some(x => BEEF.has(x[0]))) prot = "boeuf";
  else if (F.p) prot = "porc";
  else if (i.some(x => BIRD.has(x[0]))) prot = "volaille";
  return {id, n, photo:a[10]||"", e:e||"🍽️", c:CUISINES[c]?c:"fr", m, d:+d||1, t:+t||20, tg:tg||"", i, s:steps||[], F, prot, custom:!!custom,
    ix: i.map(([k,q]) => [IIDX[k], q])};
}
function buildRecipes(){
  RX = RECIPES.map(a => mkRecipe(a,false)).concat(S.custom.map(a => mkRecipe(a,true)));
  RBYID = {}; RX.forEach((r,idx) => { r.idx = idx; RBYID[r.id] = r; });
}
function rebuild(){ buildIngredients(); buildRecipes(); refreshPrices(); }

/* ════════════ Prix ════════════ */
function store(){ return STORES.find(s => s.id === S.store) || STORES[2]; }
function packPrice(k){ const c = S.prices[k]; return c != null ? c : I[k].price * store().k; }
function unitPrice(k){ return packPrice(k) / I[k].size; }
function serving(r){ return r.i.reduce((s,[k,q]) => s + q*unitPrice(k), 0); }
let PP=[], UP=[], SZ=[], ISW=[], ISPC=[], ISS=[], ISK=[], STK=[], TB=[];
function refreshPrices(){
  const n = IKEYS.length;
  PP = new Float64Array(n); UP = new Float64Array(n); SZ = new Float64Array(n); STK = new Float64Array(n);
  ISW = new Uint8Array(n); ISPC = new Uint8Array(n); ISS = new Uint8Array(n); ISK = new Uint8Array(n); TB = new Uint8Array(n);
  IKEYS.forEach((k,i) => {
    const g = I[k]; PP[i] = packPrice(k); SZ[i] = g.size; UP[i] = PP[i]/g.size;
    ISW[i] = g.fl.includes("W") ? 1 : 0; ISPC[i] = g.u === "pc" ? 1 : 0;
    ISS[i] = g.fl.includes("S") ? 1 : 0; ISK[i] = g.fl.includes("K") ? 1 : 0;
    STK[i] = S.stock[k] || 0; TB[i] = S.toBuy[k] ? 1 : 0;
  });
  RX.forEach(r => r.cost = serving(r));
}
function buyCost(i, buy){
  if (buy <= 1e-9) return 0;
  if (ISW[i]) return ISPC[i] ? Math.max(1, Math.ceil(buy - 0.05)) * PP[i] : buy * UP[i];
  return Math.max(1, Math.ceil(buy / SZ[i] - 0.08)) * PP[i];
}

/* ════════════ Optimiseur de semaine ════════════ */
const NEED = new Float64Array(4096); const TOUCH = [];
function totalFor(ids, people, useStock){
  TOUCH.length = 0;
  for (const id of ids){ if (id < 0) continue; for (const [i,q] of RX[id].ix){ if (NEED[i] === 0) TOUCH.push(i); NEED[i] += q*people; } }
  let t = 0;
  for (const i of TOUCH){
    if (!ISS[i] || TB[i]) t += buyCost(i, NEED[i] - (useStock ? STK[i] : 0));
    NEED[i] = 0;
  }
  return t;
}
const PROTS = ["vege","volaille","boeuf","porc","poisson"];
function optimize(o){
  const {slots, pools, budget, people} = o;
  const n = slots.length, costOnly = !!o.costOnly;
  const pref = new Float64Array(RX.length);
  for (let k=0;k<RX.length;k++) pref[k] = Math.random();
  const recent = o.recent || {}, favs = new Set(o.favs || []);
  const mains = []; slots.forEach((s,i) => { if (s.m !== "P") mains.push(i); });
  const nMain = mains.length;
  const cKeys = Object.keys(CUISINES);
  const capC = Math.max(2, Math.ceil(nMain*0.35)), capP = Math.max(2, Math.ceil(nMain*0.3));
  const cnt = new Map();
  function energy(ids){
    const C = totalFor(ids, people, true);
    let E = costOnly ? C : 0.3*C;
    if (!costOnly && C > budget) E += 8*(C - budget) + 5;
    cnt.clear(); let dup = 0;
    for (const id of ids){ const v = (cnt.get(id)||0) + 1; cnt.set(id,v); if (v > 1) dup++; }
    E += 50*dup;
    let V = 0;
    const cc = {}, pc = {};
    for (let j=0;j<nMain;j++){
      const r = RX[ids[mains[j]]];
      cc[r.c] = (cc[r.c]||0) + 1; pc[r.prot] = (pc[r.prot]||0) + 1;
      if (j>0){ const p = RX[ids[mains[j-1]]];
        if (p.c === r.c) V += r.c === "fr" ? 0.6 : 1.4;
        if (p.prot === r.prot && r.prot !== "vege") V += 0.9;
      }
      const sl = slots[mains[j]];
      if (sl.m === "M" && r.t > 40) V += 1.4;
      if (sl.m === "S" && r.t > 90) V += 0.8;
    }
    for (const k of cKeys) if ((cc[k]||0) > capC) V += 2*((cc[k]) - capC);
    for (const k of PROTS) if ((pc[k]||0) > capP) V += 2*((pc[k]) - capP);
    for (const id of ids){
      const r = RX[id]; const w = recent[r.id];
      if (w === 1) V += 5; else if (w === 2) V += 3; else if (w) V += 1.5;
      if (favs.has(r.id)) V -= 1;
      if (!costOnly) V -= 1.5*pref[id];
    }
    return E + (costOnly ? 0.25 : 1)*V;
  }
  const pick = arr => arr[(Math.random()*arr.length)|0];
  const locked = o.locked || [];
  let cur = [];
  const used = new Set();
  for (let i=0;i<n;i++){
    if (locked[i] != null){ cur.push(locked[i]); used.add(locked[i]); continue; }
    const pool = pools[slots[i].m];
    let c = pick(pool), tries = 0;
    while (used.has(c) && tries++ < 20) c = pick(pool);
    cur.push(c); used.add(c);
  }
  const free = []; for (let i=0;i<n;i++) if (locked[i] == null) free.push(i);
  let curE = energy(cur), best = cur.slice(), bestE = curE;
  if (!free.length) return {ids:best, cost:totalFor(best, people, true)};
  const iters = o.iters || (900 + 260*n), T0 = 3, T1 = 0.04;
  for (let it=0; it<iters; it++){
    const T = T0*Math.pow(T1/T0, it/iters);
    const i = free[(Math.random()*free.length)|0];
    const pool = pools[slots[i].m];
    const c = pick(pool); if (c === cur[i]) continue;
    const old = cur[i]; cur[i] = c;
    const e = energy(cur), d = e - curE;
    if (d < 0 || Math.random() < Math.exp(-d/T)){ curE = e; if (e < bestE){ bestE = e; best = cur.slice(); } }
    else cur[i] = old;
  }
  return {ids:best, cost:totalFor(best, people, true)};
}

/* ════════════ Filtres ════════════ */
function allowed(r, opts){

function buildList(recipes, people, useStock){

function beep(){
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = new C();
    [0, 0.35, 0.7].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.25);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3); });
  } catch(e) {}
}
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on && "wakeLock" in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    else if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && FULL.awake) keepAwake(true); });
function crumbs(x, y, n){
  if (reduced()) return;
  const colors = ["#F2C27B","#D99A4E","#2E7A4C","#E86F55","#F4B860"];
  for (let i = 0; i < (n || 26); i++){
    const c = document.createElement("i"); c.className = "crumb";
    const a = Math.random()*Math.PI*2, d = 90 + Math.random()*170;
    c.style.left = x + "px"; c.style.top = y + "px"; c.style.background = colors[i % colors.length];
    c.style.setProperty("--dx", Math.cos(a)*d + "px"); c.style.setProperty("--dy", (Math.sin(a)*d + 120) + "px"); c.style.setProperty("--rot", (Math.random()*720 - 360) + "deg");
    c.style.animationDelay = (Math.random()*80) + "ms";
    document.body.appendChild(c); setTimeout(() => c.remove(), 1600);
  }
}

/* ── Feuilles qui glissent (ressorts, glisser pour fermer) ── */
const SH = {root:null, panel:null, scrim:null, y:0, H:0, anim:null, open:false, onClose:null};
function setSheetY(y){
  SH.y = y; if (!SH.panel) return;
  SH.panel.style.transform = "translate3d(0," + y.toFixed(2) + "px,0)";
  const p = Math.max(0, Math.min(1, 1 - y/SH.H));
  SH.scrim.style.opacity = p.toFixed(3);
  const s = $("#stage");
  if (s && innerWidth < 760){ s.style.transform = p > 0.001 ? "translate3d(0," + (p*8).toFixed(2) + "px,0) scale(" + (1 - 0.06*p).toFixed(4) + ")" : ""; s.style.borderRadius = (14*p).toFixed(1) + "px"; }
}
function sheetTo(y, opt, done){ if (SH.anim) SH.anim.stop(); SH.anim = spring(SH.y, y, opt || {}, setSheetY, () => { SH.anim = null; if (done) done(); }); }
function openSheet(html, opts){
  opts = opts || {};
  sheetState = opts.state || {};
  const root = $("#sheet");
  const cls = "panel" + (opts.fit ? " fit" : "") + (opts.cls ? " " + opts.cls : "");
  const inner = '<span class="grabber" aria-hidden="true"></span><div class="pscroll">' + html + "</div>";
  if (SH.open && SH.panel){
    SH.panel.className = cls; SH.panel.setAttribute("aria-label", opts.label || "");
    SH.panel.innerHTML = inner; SH.panel.style.pointerEvents = "";
    if (SH.y > 1) sheetTo(0, {response:0.38, damping:1});
  } else {
    root.innerHTML = '<div class="scrim" data-act="close"></div><div class="' + cls + '" role="dialog" aria-modal="true" aria-label="' + esc(opts.label || "") + '">' + inner + "</div>";
    root.hidden = false;
    SH.root = root; SH.panel = root.querySelector(".panel"); SH.scrim = root.querySelector(".scrim"); SH.open = true;
    SH.H = SH.panel.getBoundingClientRect().height + 40 || innerHeight;
    setSheetY(SH.H); bindSheetDrag(); sheetTo(0, {response:0.44, damping:1});
  }
  SH.onClose = opts.onClose || null;
  const f = root.querySelector("[data-autofocus]"); if (f && innerWidth >= 760) setTimeout(() => f.focus(), 380);
  hydrate();
}
function closeSheet(velocity){
  sheetState = null;
  if (!SH.open) return;
  SH.open = false;
  const panel = SH.panel, cb = SH.onClose; SH.onClose = null;
  sheetTo(SH.H, {response:0.36, damping:1, velocity:velocity || 0}, () => {
    if (SH.open) return;
    SH.root.hidden = true; SH.root.innerHTML = ""; SH.panel = null;
    const s = $("#stage"); if (s){ s.style.transform = ""; s.style.borderRadius = ""; }
  });
  if (panel) panel.style.pointerEvents = "none";
  if (cb) cb();
}
function refreshSheet(fn){ const p = $("#sheet .pscroll"); const top = p ? p.scrollTop : 0; fn(); const p2 = $("#sheet .pscroll"); if (p2) p2.scrollTop = top; }
function bindSheetDrag(){
  const panel = SH.panel;
  let startY = 0, dragging = false, samples = [], base = 0, scrollEl = null, tracking = false;
  const begin = y => { if (SH.anim){ SH.anim.stop(); SH.anim = null; } startY = y; base = SH.y; samples = [{y, t:performance.now()}]; };
  const move = y => { let ny = base + (y - startY); if (ny < 0) ny = -rubber(-ny, SH.H*0.2); setSheetY(ny); samples.push({y, t:performance.now()}); if (samples.length > 6) samples.shift(); };
  const end = () => {
    const a = samples[0], b = samples[samples.length-1];
    const v = b && a && b.t > a.t ? (b.y - a.y) / ((b.t - a.t)/1000) : 0;
    if (SH.y + project(v, 0.99) > SH.H*0.36 && SH.y > 0){ closeSheet(v); afterSheetClose(); }
    else sheetTo(0, {response:0.38, damping:0.86, velocity:v});
  };
  panel.addEventListener("touchstart", e => { if (!SH.open) return; scrollEl = panel.querySelector(".pscroll"); tracking = true; dragging = false; startY = e.touches[0].clientY; base = SH.y; }, {passive:true});
  panel.addEventListener("touchmove", e => {
    if (!tracking || !SH.open) return;
    const t = e.touches[0], dy = t.clientY - startY;
    if (!dragging){
      if (dy > 8 && (!scrollEl || scrollEl.scrollTop <= 0) && !e.target.closest(".chips.scroll,.favs,input,textarea,select")){ dragging = true; begin(t.clientY); }
      else if (Math.abs(dy) > 8){ tracking = false; return; } else return;
    }
    e.preventDefault(); move(t.clientY);
  }, {passive:false});
  panel.addEventListener("touchend", () => { if (dragging) end(); dragging = false; tracking = false; }, {passive:true});
  panel.addEventListener("touchcancel", () => { if (dragging) end(); dragging = false; tracking = false; }, {passive:true});
  panel.addEventListener("pointerdown", e => {
    if (e.pointerType !== "mouse" || !e.target.closest(".grabber,.phead,.rhero") || e.target.closest("button,a")) return;
    panel.setPointerCapture(e.pointerId); dragging = true; begin(e.clientY);
  });
  panel.addEventListener("pointermove", e => { if (dragging && e.pointerType === "mouse") move(e.clientY); });
  panel.addEventListener("pointerup", e => { if (dragging && e.pointerType === "mouse"){ dragging = false; end(); } });
}
function afterSheetClose(){ render(); }

function nextMeal(){
  const w = S.week; if (!w) return null;
  const ti = todayIndex();
  const sl = w.slots.map((s, i) => ({...s, i}));
  const up = sl.filter(s => (s.d > ti || (s.d === ti && !slotPast(s))) && s.d >= 0);
  return up.length ? up[0] : null;
}
function frozenIn(r){ return r.i.filter(([k]) => I[k] && (I[k].r === "sg" || k === "colin" || k === "crevette")).map(([k]) => I[k].n.toLowerCase()); }
function hintFor(s){
  const r = RBYID[s.id]; if (!r) return null;
  if (S.week.batch && s.m !== "P"){
    const info = batchInfo(r), day = s.d + 1;
    const frigo = day <= Math.min(3, info.fridge || 0) || !info.freeze;
    return frigo ? {ice:false, t:"Ta boîte est prête au frigo : 2 à 3 minutes au micro-ondes en remuant à mi-temps."}
                 : {ice:true, t:"Ta boîte est au congélateur. Sors-la le matin au frigo, ou décongèle-la 6 à 8 minutes au micro-ondes."};
  }
  const fz = frozenIn(r);
  if (fz.length) return {ice:true, t:"À décongeler : " + fz.join(", ") + ". Si tu as oublié, passe-le en mode décongélation au micro-ondes."};
  const main = r.i.filter(([k]) => I[k] && !I[k].fl.includes("S") && I[k].r !== "fl").map(([k]) => I[k].n.toLowerCase());
  const fresh = r.i.filter(([k]) => I[k] && I[k].r === "fl").map(([k]) => I[k].n.toLowerCase());
  const take = main.concat(fresh).slice(0, 3);
  return {ice:false, t:"Rien à décongeler. Sors " + (take.length > 1 ? take.slice(0,-1).join(", ") + " et " + take[take.length-1] : take[0] || "tes ingrédients") + "."};
}
function tomorrowAlert(){
  const w = S.week; if (!w || w.batch) return null;
  const ti = todayIndex();
  const tm = w.slots.filter(s => s.d === ti + 1 && s.m !== "P");
  for (const s of tm){ const r = RBYID[s.id]; if (!r) continue; const fz = frozenIn(r); if (fz.length) return "Pour demain " + MEALS[s.m].toLowerCase() + " : sors " + fz.join(", ") + " du congélateur ce soir et mets-le au frigo."; }
  return null;
}

function recipeResults(){

let moreObs = null;
function setupMore(){
  if (moreObs) moreObs.disconnect();
  const el = $("#more"); if (!el || !("IntersectionObserver" in window)) return;
  moreObs = new IntersectionObserver(es => {
    if (!es[0].isIntersecting || !UI.more || UI.shown >= UI.more.length) return;
    const next = UI.more.slice(UI.shown, UI.shown + 24); UI.shown += next.length;
    $("#rgrid").insertAdjacentHTML("beforeend", next.map(rcard).join("")); hydrate();
  }, {root:SC(), rootMargin:"600px"});
  moreObs.observe(el);
}

/* ── Sauvegarde et restauration ── */
function backupData(){
  const data = JSON.stringify({app:"biscuit", v:2, date:new Date().toISOString(), state:S}, null, 1);
  const name = "biscuit-sauvegarde-" + todayISO() + ".json";
  let file = null;
  try { file = new File([data], name, {type:"application/json"}); } catch(e) {}
  if (file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file], title:"Sauvegarde Biscuit"}).then(() => toast("Sauvegarde prête"), err => { if (err && err.name !== "AbortError") downloadBlob(data, name); });
    return;
  }
  downloadBlob(data, name);
}
function downloadBlob(data, name){
  try {
    const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Sauvegarde téléchargée");
  } catch(e){ copyText(data, "Sauvegarde copiée : colle-la dans une note"); }
}
function openRestore(){
  const h = phead("Restaurer", '<button class="btn sm" data-act="settings">Retour</button>') + '<div class="pbody"><p style="margin:0;line-height:1.5">Choisis le fichier de sauvegarde (biscuit-sauvegarde-….json), ou colle le texte d\'une sauvegarde.</p>' +

function restoreFrom(text){
  try {
    const j = JSON.parse(text); const st = j && j.state ? j.state : j;
    if (!st || typeof st !== "object" || !("budget" in st)) throw 0;
    S = Object.assign(DEFAULT(), st); save(); rebuild(); applyTheme(); closeSheet(); render(); toast("Données restaurées");
  } catch(e){ toast("Ce fichier n'est pas une sauvegarde Biscuit valide", IC.close); }
}
function copyText(txt, okMsg){
  const done = () => toast(okMsg);
  const fallback = () => {
    const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch(e) {} ta.remove();
    if (ok) done(); else openSheet(phead("Copier") + '<div class="pbody"><p class="note">Sélectionne le texte ci-dessous et copie-le.</p><textarea class="input" readonly style="min-height:260px">' + esc(txt) + "</textarea></div>", {label:"Copier"});
  };
  try { navigator.clipboard.writeText(txt).then(done, fallback); } catch(e) { fallback(); }
}

/* ── Minuteur (survit à la mise en veille : on garde l'heure de fin) ── */
let tmInt = 0, tmEndShown = 0;
function tmState(){ return S.timer && S.timer.end ? S.timer : null; }
function startTimer(min, label, ref){
  try { const C = window.AudioContext || window.webkitAudioContext; if (C && !window.__ac){ window.__ac = new C(); } if (window.__ac) window.__ac.resume(); } catch(e) {}
  S.timer = {end:Date.now() + min*60000, total:min*60000, label:label || "Minuteur", ref:ref || "", paused:0};
  save(); buzz(10); timerLoop(); toast("Minuteur lancé : " + timeLabel(min), IC.clock);
}
function stopTimer(silent){ S.timer = null; save(); timerLoop(); if (!silent) buzz(6); }
function pauseTimer(){
  const t = tmState(); if (!t) return;
  if (t.paused){ t.end = Date.now() + t.paused; t.paused = 0; } else { t.paused = Math.max(0, t.end - Date.now()); }
  save(); timerLoop();
}
function addTimer(sec){ const t = tmState(); if (!t) return; if (t.paused) t.paused += sec*1000; else t.end += sec*1000; t.total += sec*1000; save(); timerTick(); }
function tmLeft(){ const t = tmState(); if (!t) return 0; return t.paused ? t.paused : Math.max(0, t.end - Date.now()); }
const mmss = ms => { const s = Math.ceil(ms/1000); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
function timerLoop(){ clearInterval(tmInt); if (tmState()) tmInt = setInterval(timerTick, 250); timerTick(); }
function ringSVG(r, frac, w){
  const c = 2*Math.PI*r;
  return '<svg viewBox="0 0 ' + (2*r + w) + " " + (2*r + w) + '" aria-hidden="true"><circle class="tr" cx="' + (r + w/2) + '" cy="' + (r + w/2) + '" r="' + r + '"/><circle class="fg" cx="' + (r + w/2) + '" cy="' + (r + w/2) + '" r="' + r + '" style="stroke-dasharray:' + c.toFixed(1) + ";stroke-dashoffset:" + (c*(1 - frac)).toFixed(1) + '"/></svg>';
}
function timerTick(){
  const t = tmState(), pill = $("#tpill");
  if (!pill) return;
  const card = $("#tcard");
  if (!t){
    pill.hidden = true; pill.className = "";
    if (card) refreshTimerCard();
    return;
  }
  const left = tmLeft(), frac = t.total ? 1 - left/t.total : 0;
  // Pastille : cachée dans le mode cuisine quand la carte du minuteur est visible
  const showPill = !(card && card.dataset.ref === t.ref);
  if (showPill){
    if (pill.hidden){ pill.hidden = false; pill.className = "in"; }
    pill.innerHTML = '<span class="rg">' + ringSVG(13, frac, 4) + '</span><b>' + mmss(left) + '</b><span class="l">' + esc(t.paused ? "En pause · " + t.label : t.label) + '</span><button data-act="tpause" aria-label="' + (t.paused ? "Reprendre" : "Mettre en pause") + '">' + (t.paused ? IC.play : '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>') + '</button><button data-act="tstop" aria-label="Arrêter le minuteur">' + IC.close + "</button>";
  } else { pill.hidden = true; }
  if (card) updateTimerCard(left, frac, t);
  if (!t.paused && left <= 0){
    clearInterval(tmInt);
    S.timer = null; save();
    beep(); buzz([220,120,220,120,220]);
    toast("C'est l'heure ! " + t.label, IC.clock);
    pill.hidden = false; pill.className = "ring";
    pill.innerHTML = '<span class="rg">' + ringSVG(13, 1, 4) + '</span><b>0:00</b><span class="l">' + esc(t.label) + '</span><button data-act="tstop" aria-label="Fermer">' + IC.check + "</button>";
    clearTimeout(tmEndShown); tmEndShown = setTimeout(() => { if (!tmState()){ pill.hidden = true; pill.className = ""; } }, 8000);
    if (card) refreshTimerCard(true);
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") timerTick(); });

/* ── Mode cuisine ── */
const CK = {rid:null, people:1, slot:null, i:-1, steps:[], ann:[], ings:[], mep:[], done:[], dir:0};
function stepIngredients(r, steps, mult){
  const used = new Set();
  return steps.map(s => {
    const out = [];
    for (const [k, q] of r.i){
      if (used.has(k) || k === "eau" || !KWRE[k] || !I[k]) continue;
      if (KWRE[k].test(s)){ used.add(k); out.push([k, q*mult]); }
    }
    return out;
  });
}
function openCook(id, opts){
  const r = RBYID[id]; if (!r) return;
  opts = opts || {};
  const D = (typeof DETAILS !== "undefined" && DETAILS[id]) || null;

/* Glisser à gauche / à droite pour changer d'étape (suit le doigt, puis ressort) */
function bindCookSwipe(){
  const st = $("#cstage"); if (!st) return;
  let x0 = 0, y0 = 0, dx = 0, lock = 0, samples = [], anim = null;
  const set = x => { st.style.transform = x ? "translate3d(" + x.toFixed(1) + "px,0,0)" : ""; };
  st.addEventListener("touchstart", e => { if (anim){ anim.stop(); anim = null; } const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; lock = 0; samples = [{x:x0, t:performance.now()}]; }, {passive:true});
  st.addEventListener("touchmove", e => {
    const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (!lock){ if (Math.abs(mx) > 10 && Math.abs(mx) > Math.abs(my)*1.2) lock = 1; else if (Math.abs(my) > 10) lock = -1; }
    if (lock !== 1) return;
    e.preventDefault();
    const atEdge = (mx > 0 && CK.i <= -1) || (mx < 0 && CK.i >= CK.steps.length);
    dx = atEdge ? rubber(mx, innerWidth*0.5) : mx;
    set(dx); samples.push({x:t.clientX, t:performance.now()}); if (samples.length > 6) samples.shift();
  }, {passive:false});
  const end = () => {
    if (lock !== 1){ lock = 0; return; }
    lock = 0;
    const a = samples[0], b = samples[samples.length - 1];
    const v = b && a && b.t > a.t ? (b.x - a.x)/((b.t - a.t)/1000) : 0;
    const proj = dx + project(v, 0.99), W = innerWidth;
    if (proj < -W*0.28 && CK.i < CK.steps.length){ animOut(-1, v); return; }
    if (proj > W*0.28 && CK.i > -1){ animOut(1, v); return; }

  };
  function animOut(sign, v){
    anim = spring(dx, sign*innerWidth*0.9, {response:0.22, damping:1, velocity:v}, x => { set(x); st.style.opacity = String(Math.max(0, 1 - Math.abs(x)/innerWidth)); }, () => { anim = null; cookGo(sign < 0 ? 1 : -1); });
  }
  st.addEventListener("touchend", end, {passive:true});
  st.addEventListener("touchcancel", end, {passive:true});
}

function loadScript(src){

}
async function ticketFromFile(file){

  ticketRender();

    if (!navigator.onLine && !window.Tesseract) throw new Error("offline");
    await loadScript(TESS);
    const labels = {"loading tesseract core":"Chargement de l'outil de lecture…", "initializing tesseract":"Démarrage…", "loading language traineddata":"Chargement du français…", "initializing api":"Démarrage…", "recognizing text":"Lecture du ticket…"};
    const worker = await Tesseract.createWorker("fra", 1, {logger: m => {

      TK.prog = Math.max(TK.prog, base); TK.step = labels[m.status] || TK.step;

    ticketRender();

}
function shrinkImage(file, max){
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max/Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const g = c.getContext("2d"); g.filter = "grayscale(1) contrast(1.25)"; g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.88));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error("img")); };
    img.src = url;
  });
}
/* Lecture des lignes : « LIBELLÉ … 1,29 » ; ignore totaux, paiements, TVA */
const TK_SKIP = /total|sous[- ]?tot|tva|carte|cb\b|esp[eè]ces|rendu|monnaie|paiement|montant|ticket|merci|avantage|fid[eé]lit|remise|bon d|net a payer|à payer|a payer|siret|tel\b|caisse|articles?\b|points?\b|solde|achat|visa|mastercard|contact|emv/i;
const TK_NONFOOD = /sac\b|cabas|consigne|piles?|sopalin|essuie|papier toil|lessive|liquide vais|eponge|éponge|shampo|gel douche|dentifrice/i;
const normT = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
function parseTicket(text){
  const out = [];
  const rows = String(text).split(/\r?\n/).map(l => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  for (let j = 0; j < rows.length; j++){
    const raw = rows[j];
    if (TK_SKIP.test(raw)) continue;
    const m = raw.match(/^(.*?[A-Za-zÀ-ÿ].*?)\s+(-?\d{1,3}[.,]\d{2})\s*(?:€|eur|[A-D]|\*)?\s*(?:[A-D]|\d)?$/i);
    if (!m) continue;
    let name = m[1].replace(/\s+\d+\s*[xX*]\s*\d+[.,]\d{2}.*$/, "").trim(), price = parseFloat(m[2].replace(",", "."));
    if (!(price > 0) || price > 80) continue;
    const q = raw.match(/(\d+)\s*[xX*]\s*(\d+[.,]\d{2})/); if (q) price = parseFloat(q[2].replace(",", "."));
    const kg = raw.match(/(\d+[.,]\d{3})\s*kg\s*[xX*]?\s*(\d+[.,]\d{2})/i);
    name = name.replace(/^\d+\s+/, "").replace(/\s{2,}/g, " ");
    if (name.replace(/[^A-Za-zÀ-ÿ]/g, "").length < 3) continue;
    out.push({raw, name, price, perKg: kg ? parseFloat(kg[2].replace(",", ".")) : 0});
  }
  return out;
}
function matchIng(name, weekKeys){
  const n = normT(name); if (S.alias && S.alias[n]) return {k:S.alias[n], sure:true};
  const toks = n.split(" ").filter(t => t.length >= 3 && !/^\d/.test(t) && !/^(les|des|aux|pour|avec|bio|lot|pack|bte|boite|sachet|barq|frais|fraiche|extra|marque|repere|cora|lidl|aldi|eco|prix)$/.test(t));
  if (!toks.length) return null;
  let best = null;
  for (const k of IKEYS){
    const g = I[k]; if (!g) continue;
    const ws = normT(g.n).split(" ").filter(w => w.length >= 3 && !/^(les|des|aux|pour|avec|boite|sachet|frais|fraiche)$/.test(w));
    if (!ws.length) continue;
    let hit = 0;
    for (const w of ws) if (toks.some(t => w.startsWith(t) || t.startsWith(w) || (t.length >= 4 && w.startsWith(t.slice(0, 4))))) hit++;
    if (!hit) continue;
    let sc = hit/ws.length + (toks.some(t => ws[0].startsWith(t) || t.startsWith(ws[0])) ? 0.25 : 0) + (weekKeys.has(k) ? 0.2 : 0);
    if (!best || sc > best.sc) best = {k, sc};
  }
  return best && best.sc >= 0.75 ? {k:best.k, sure:best.sc >= 1} : null;
}
function ticketFromText(text){
  const weekKeys = new Set(S.week ? listData().items.map(it => it.k) : []);
  TK.lines = parseTicket(text).map(l => {
    const m = matchIng(l.name, weekKeys), ign = !m && TK_NONFOOD.test(l.name);
    const k = m ? m.k : null;
    let price = l.price;
    if (k && l.perKg && I[k].u === "g") price = Math.round(l.perKg*I[k].size/10)/100;
    const old = k ? packPrice(k) : 0;
    return {raw:l.raw, name:l.name, price, k, ign, on:!!k && Math.abs(price - old) > 0.004, old};
  });
  TK.status = "done"; ticketRender();
}
function openTicketPick(j){

function tkPickList(q){

}
function applyTicket(){

  scuisine: el => { toggleArr(S.cuisines, el.dataset.k); if (!S.cuisines.length) S.cuisines.push(el.dataset.k); settingsRefresh(true); },
  stheme: el => { S.theme = el.dataset.k; save(); applyTheme(); buzz(5); $$('[data-act="stheme"]').forEach(b => b.setAttribute("aria-checked", b === el ? "true" : "false")); },
  smotion: el => { S.reduceMotion = !S.reduceMotion; el.setAttribute("aria-checked", S.reduceMotion); save(); applyTheme(); },
  pricesheet: () => openPriceList(),
  stocksheet: () => openStockList(),
  stockdel: el => { delete S.stock[el.dataset.k]; save(); refreshPrices(); refreshSheet(openStockList); keepY(render); },
  backup: () => backupData(),
  restore: () => openRestore(),
  restorefile: () => { const f = $("#sheet #restoreFile"); if (f) f.click(); },
  restoretext: () => { const t = ($("#imp") || {}).value || ""; if (!t.trim()){ toast("Colle d'abord ta sauvegarde", IC.close); return; } restoreFrom(t); },
  resetask: () => openConfirm("Tout effacer ?", "Ta semaine, tes recettes, tes prix et ton placard seront supprimés de ce téléphone. Pense à sauvegarder avant.",
    '<button class="btn block" data-act="resetgo" style="background:var(--warn);color:#fff">' + IC.trash + 'Oui, tout effacer</button><button class="btn block" data-act="settings">Annuler</button>'),
  resetgo: () => { S = DEFAULT(); S.launches = 1; save(); rebuild(); applyTheme(); closeSheet(); UI.tab = "today"; render(); showOnboarding(); },

  /* Ma recette */
  newrecipe: () => openRecipeForm(null),
  editrecipe: el => openRecipeForm(el.dataset.id),
  fmeal: el => { const d = sheetState.d, k = el.dataset.k; d.m = d.m.includes(k) ? d.m.replace(k, "") : d.m + k; el.setAttribute("aria-checked", d.m.includes(k)); buzz(5); },
  fdiff: el => { segPick(el); sheetState.d.d = +el.dataset.k; },
  fiadd: () => { sheetState.d.i.push(["", 0]); renderForm(); },
  fidel: el => { sheetState.d.i.splice(+el.dataset.j, 1); if (!sheetState.d.i.length) sheetState.d.i.push(["", 0]); renderForm(); },
  niadd: () => {
    const n = $("#ni-n").value.trim(), u = $("#ni-u").value, s = parseFloat($("#ni-s").value), p = parseFloat(String($("#ni-p").value).replace(",", ".")), r = $("#ni-r").value;
    if (!n || !(s > 0) || !(p >= 0)){ toast("Remplis le nom, la taille et le prix du paquet.", IC.close); return; }
    const k = "perso_" + Date.now().toString(36);
    S.customIng[k] = [n, u, s, p, r, ""]; save(); rebuild();
    const d = sheetState.d, empty = d.i.findIndex(x => !x[0]);
    if (empty >= 0) d.i[empty] = [k, 0]; else d.i.push([k, 0]);
    renderForm(); toast("Ingrédient créé");
  },
  fsave: () => {
    const d = sheetState.d;
    const ings = d.i.filter(x => x[0] && I[x[0]] && x[1] > 0).map(x => [x[0], +x[1]]);
    const steps = d.s.split("\n").map(s => s.trim()).filter(Boolean);
    const err = !d.n.trim() ? "Donne un nom à ta recette." : !d.m ? "Choisis au moins un repas." : !ings.length ? "Ajoute au moins un ingrédient avec sa quantité." : !steps.length ? "Écris au moins une étape." : "";
    if (err){ $("#ferr").innerHTML = '<div class="hint" style="background:var(--warn-tint);color:var(--warn-text)">' + IC.close + "<span>" + err + "</span></div>"; $("#ferr").scrollIntoView({block:"center", behavior: reduced() ? "auto" : "smooth"}); return; }
    const id = sheetState.id || "perso-" + Date.now().toString(36);
    const arr = [id, d.n.trim(), d.e || "🍽️", d.c, ["P","M","S"].filter(m => d.m.includes(m)).join(""), d.d, Math.max(1, +d.t || 20), "", ings, steps, (d.ph || "").trim()];
    const i = S.custom.findIndex(a => a[0] === id);
    if (i >= 0) S.custom[i] = arr; else S.custom.push(arr);
    save(); rebuild(); UI.tab = "recipes"; UI.rf = "mine"; render(); toast("Recette enregistrée"); openRecipe(id);
  },
  fdelete: () => {
    const id = sheetState.id; S.custom = S.custom.filter(a => a[0] !== id);
    if (S.week) S.week.slots.forEach(s => { if (s.id === id){ const alt = RX.find(r => !r.custom && r.m.includes(s.m) && allowed(r)); if (alt) s.id = alt.id; } });
    save(); rebuild(); closeSheet(); if (UI.rf === "mine" && !S.custom.length) UI.rf = "all"; keepY(render); toast("Recette supprimée");
  },
  rf: el => { if (UI.rf === el.dataset.k) return; UI.rf = el.dataset.k; $$('[data-act="rf"]').forEach(b => b.setAttribute("aria-pressed", b === el)); buzz(4); setTimeout(() => keepY(render), 0); },

  /* Premier lancement */
  obstore: el => { S.store = el.dataset.k; OB.picked = true; save(); $$(".storeb").forEach(b => b.setAttribute("aria-pressed", b === el ? "true" : "false")); buzz(8); const n = $('#obf [data-act="obnext"]'); if (n) n.disabled = false; setTimeout(() => { if (OB.step === 1){ OB.step = 2; OB.dir = 1; renderOB(); } }, reduced() ? 0 : 320); },
  obnext: () => { OB.step++; OB.dir = 1; renderOB(); },
  obback: () => { OB.step--; OB.dir = -1; renderOB(); },
  obbudget: el => { S.budget = Math.max(5, Math.min(500, (+S.budget || 0) + +el.dataset.d)); save(); const i = $("#obb"); if (i){ i.value = S.budget; i.classList.remove("bump"); void i.offsetWidth; i.classList.add("bump"); } buzz(4); refreshFeas(); },
  obpeople: el => { S.people = Math.max(1, Math.min(12, S.people + +el.dataset.d)); save(); const o = el.parentNode.querySelector("output"); if (o) o.textContent = S.people; buzz(4); refreshFeas(); },
  obmeal: el => { const k = el.dataset.k; S.meals[k] = !S.meals[k]; el.setAttribute("aria-checked", S.meals[k]); save(); buzz(5); refreshFeas(); },
  obdays: el => { segPick(el); S.days = +el.dataset.k; save(); refreshFeas(); },
  obdiet: el => { segPick(el); S.diet = el.dataset.k; save(); feasCache = {}; },
  oballergy: el => { toggleArr(S.allergies, el.dataset.k); el.setAttribute("aria-pressed", S.allergies.includes(el.dataset.k)); feasCache = {}; save(); },
  obcuisine: el => { toggleArr(S.cuisines, el.dataset.k); if (!S.cuisines.length) S.cuisines.push(el.dataset.k); el.setAttribute("aria-pressed", S.cuisines.includes(el.dataset.k)); feasCache = {}; save(); },
  obfinish: () => obFinish()
};

/* ── Événements ── */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.tagName === "A") return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.disabled) return;
  e.preventDefault(); fn(el, e);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    if (SH.open){ closeSheet(); if (!FULL.kind) keepY(render); return; }
    if (FULL.kind === "cook") return closeCook();
    if (FULL.kind === "store") return closeStore();
    if (FULL.kind) return closeFull();
  }
  if (FULL.kind === "cook" && !SH.open && !e.target.closest("input,textarea")){
    if (e.key === "ArrowRight"){ e.preventDefault(); cookGo(1); }
    if (e.key === "ArrowLeft"){ e.preventDefault(); cookGo(-1); }
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')){ e.preventDefault(); const fn = A[e.target.dataset.act]; if (fn) fn(e.target, e); }
});
document.addEventListener("input", e => {
  const el = e.target, k = el.dataset.in; if (!k) return;
  if (k === "rq"){ UI.q = el.value; clearTimeout(UI.qt); UI.qt = setTimeout(() => { const pos = el.selectionStart; render(); const n = $("#rq"); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(_){} } }, 120); }
  else if (k === "sq"){
    UI.swapQ = el.value; const slot = sheetState.slot;
    if (!UI.swapQ.trim()){ refreshSheet(() => openSwap(slot)); const n = $("#sq"); if (n) n.focus(); return; }
    $("#swaplist").innerHTML = swapListHTML(slot, [], swapScored(slot, true), normW(UI.swapQ.trim())); hydrate();
  }
  else if (k === "bsq"){
    UI.swapQ = el.value; const id = sheetState && sheetState.id; if (!id) return;
    if (!UI.swapQ.trim()){ refreshSheet(() => openBatchSwap(id)); const n = $("#bsq"); if (n) n.focus(); return; }
    $("#swaplist").innerHTML = batchSwapList(id, [], batchSwapScored(id), normW(UI.swapQ.trim())); hydrate();
  }
  else if (k === "tkq"){ const l = $("#tkpl"); if (l) l.innerHTML = tkPickList(el.value.trim()); }
  else if (k === "sname"){ S.name = el.value.trim().slice(0, 30); save(); }
  else if (k === "stime"){ if (/^\d{2}:\d{2}$/.test(el.value)){ S.times[el.dataset.k] = el.value; save(); } }
  else if (k === "obb"){ const v = parseFloat(el.value); if (v > 0){ S.budget = Math.min(500, v); save(); refreshFeas(); } }
  else if (k === "stock"){ const v = parseFloat(el.value); if (v >= 0){ S.stock[el.dataset.k] = v; save(); refreshPrices(); } }
  else if (sheetState && sheetState.kind === "form"){
    const d = sheetState.d;
    if (k === "fn") d.n = el.value; else if (k === "fp") d.ph = el.value; else if (k === "fc2") d.c = el.value;
    else if (k === "ft") d.t = +el.value; else if (k === "fs") d.s = el.value;
    else if (k === "fq") d.i[+el.dataset.j][1] = parseFloat(el.value) || 0;
    else if (k === "fi"){ const j = +el.dataset.j, name = el.value.trim().toLowerCase(); const key = IKEYS.find(x => I[x].n.toLowerCase() === name); d.i[j][0] = key || ""; d.i[j][2] = el.value; }
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.in === "tkfile"){ const f = el.files && el.files[0]; if (f) ticketFromFile(f); el.value = ""; return; }
  if (el.id === "restoreFile"){ const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => restoreFrom(String(rd.result || "")); rd.onerror = () => toast("Impossible de lire ce fichier", IC.close); rd.readAsText(f); el.value = ""; return; }
  if (el.dataset.in === "fi" || el.dataset.in === "fc2"){ if (sheetState && sheetState.kind === "form") renderForm(); }
  if (el.dataset.in === "sname" || el.dataset.in === "stime" || el.dataset.in === "stock") keepY(render);
});

/* ── Démarrage ── */
function start(){
  rebuild(); shell(); applyTheme();
  S.launches = (S.launches || 0) + 1; save();
  if (S.onboarded && !S.week) generateWeek();
  render(); timerLoop();
  showSplash(() => { if (!S.onboarded) showOnboarding(); });
}
start();
window.__biscuit = {get S(){ return S; }, generateWeek, generateBatchWeek, weekTotal, minCostEstimate, buildList, RX:() => RX, I:() => I, render, go, GX, A, openCook, openRecipe, openStore, openTicket, ticketFromText};

})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})})}</script>
