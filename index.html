X("porridge-banane","Une petite casserole, une cuillère en bois, un bol.",[
 "Verse les flocons d'avoine dans la casserole, sans rien d'autre. Fais-les griller 1 minute à feu moyen en remuant : ils sentent légèrement la noisette, ça donne beaucoup plus de goût.",
 "Ajoute le lait froid et une pincée de sel. Le sel ne se sent pas mais réveille le sucré.",
 "Porte à petite ébullition à feu moyen, puis baisse sur feu doux dès que les premières bulles apparaissent, sinon le lait déborde.",
 "Laisse cuire 4 à 5 minutes en remuant souvent, surtout au fond de la casserole. Le porridge est prêt quand il nappe la cuillère et que les flocons sont tendres.",
 "Hors du feu, ajoute la cannelle et la moitié de la banane écrasée à la fourchette : elle sucre naturellement et rend le porridge crémeux.",
 "Verse dans le bol, coupe le reste de banane en rondelles par-dessus et termine par le filet de miel. S'il a trop épaissi, détends-le avec un trait de lait."
],["Le porridge épaissit en refroidissant : arrête la cuisson quand il te semble encore un peu trop liquide.","Tu peux le préparer au micro-ondes : 2 minutes à pleine puissance, tu remues, puis encore 1 minute."],"Se garde 2 jours au frigo. Réchauffe avec un peu de lait.");
X("tartines-confiture","Un couteau à pain, un grille-pain ou une poêle.",[
 "Sors le beurre du frigo 10 minutes avant si tu peux : il s'étale sans déchirer le pain.",
 "Coupe le morceau de baguette en deux dans l'épaisseur, puis chaque moitié en deux tronçons.",
 "Fais griller 2 à 3 minutes au grille-pain, ou à sec dans une poêle chaude, face coupée contre le fond, jusqu'à ce que le pain soit doré et croustillant.",
 "Tartine aussitôt le beurre sur le pain encore chaud pour qu'il fonde légèrement.",
 "Étale la confiture par-dessus, jusqu'aux bords."
],["Une baguette de la veille devient parfaite une fois grillée.","Une pincée de fleur de sel sur le beurre, avant la confiture, change tout."],"La baguette se congèle coupée en tronçons ; elle passe directement du congélateur au grille-pain.");
X("yaourt-granola","Un bol, une cuillère.",[
 "La veille au soir, mets les fruits rouges dans un petit récipient au frigo pour qu'ils décongèlent doucement. Sinon, passe-les 40 à 60 secondes au micro-ondes.",
 "Écrase la moitié des fruits à la fourchette avec leur jus : ça fait une sauce express.",
 "Verse le yaourt dans le bol et lisse le dessus avec le dos de la cuillère.",
 "Dépose la sauce aux fruits, puis les fruits entiers.",
 "Ajoute le granola au dernier moment, juste avant de manger, pour qu'il reste croquant, et termine par le filet de miel."
],["Pour l'emporter, mets le granola dans un sachet à part et ajoute-le au moment de manger."],"À manger tout de suite une fois monté. Les fruits décongelés se gardent 2 jours au frigo.");
X("oeufs-brouilles","Une petite poêle antiadhésive, une spatule souple, un bol, un fouet ou une fourchette.",[
 "Casse les œufs dans le bol. Bats-les à la fourchette 30 secondes, jusqu'à ce que le blanc et le jaune soient bien mélangés. Sale légèrement.",
 "Fais fondre le beurre dans la poêle à feu doux. Il doit mousser doucement, sans brunir.",
 "Verse les œufs et laisse-les 20 secondes sans toucher.",
 "Avec la spatule, ramène doucement les bords vers le centre en continu, en grattant bien le fond. Garde le feu doux : la cuisson prend 3 à 4 minutes.",
 "Pendant ce temps, fais griller le pain.",
 "Retire la poêle du feu quand les œufs sont encore brillants et un peu baveux : ils finissent de cuire avec la chaleur de la poêle.",
 "Dresse sur les toasts, poivre et parsème de ciboulette ciselée aux ciseaux."
],["Le secret, c'est le feu doux : des œufs brouillés cuits trop fort deviennent secs et granuleux.","Une cuillère de crème ou un petit morceau de beurre froid ajouté à la fin les rend encore plus crémeux."],"À manger tout de suite.");
X("pancakes","Un saladier, un fouet, une louche, une poêle antiadhésive, une spatule.",[
 "Dans le saladier, mélange la farine, le sucre, la levure et une pincée de sel.",
 "Creuse un puits au centre, casse l'œuf dedans et commence à fouetter en versant le lait petit à petit. Fouette juste ce qu'il faut : quelques petits grumeaux, ce n'est pas grave.",
 "Fais fondre le beurre et incorpore-le à la pâte. Laisse reposer 10 minutes : la levure commence à agir et les pancakes seront plus épais.",
 "Chauffe la poêle à feu moyen, sans matière grasse ou avec un essuie-tout à peine huilé.",
 "Verse une petite louche de pâte (environ 2 cuillères à soupe) sans l'étaler. Elle forme un disque épais d'environ 10 cm.",
 "Attends que des bulles apparaissent à la surface et que les bords paraissent secs, environ 2 minutes. Retourne d'un coup de spatule.",
 "Laisse cuire 1 minute de l'autre côté, jusqu'à ce qu'il soit doré. Garde les pancakes au chaud sous un torchon pendant que tu fais les autres.",
 "Sers en pile avec la confiture, du miel ou du sirop."
],["Si les pancakes brunissent avant que les bulles n'apparaissent, la poêle est trop chaude : baisse le feu.","Le premier pancake est souvent raté, c'est normal : il sert à régler la température."],"Les pancakes cuits se gardent 2 jours au frigo ou 2 mois au congélateur. Réchauffe-les au grille-pain.");
X("smoothie","Un blender (ou un mixeur plongeant et un grand verre haut).",[
 "Épluche la banane et coupe-la en tronçons.",
 "Mets dans le blender d'abord le lait et le yaourt (les liquides en premier évitent que les lames tournent à vide), puis la banane et les fruits rouges encore surgelés.",
 "Ajoute le miel.",
 "Mixe 30 secondes à petite vitesse, puis 1 minute à pleine vitesse, jusqu'à ce que ce soit parfaitement lisse.",
 "Goûte : ajoute un peu de miel si c'est trop acide, ou un trait de lait si c'est trop épais. Bois aussitôt."
],["Les fruits surgelés rendent le smoothie bien frais sans glaçons.","Une banane bien mûre (avec des taches brunes) le sucre davantage."],"À boire tout de suite : il se sépare au bout de quelques heures.");
X("pain-perdu","Une assiette creuse, une fourchette, une poêle, une spatule.",[
 "Dans l'assiette creuse, bats l'œuf avec le lait, le sucre et la cannelle jusqu'à ce que le mélange soit homogène.",
 "Trempe chaque tranche de pain 10 à 15 secondes de chaque côté : elle doit être imbibée mais pas en train de se déchirer. Le pain un peu rassis absorbe mieux.",
 "Fais fondre le beurre dans la poêle à feu moyen jusqu'à ce qu'il mousse.",
 "Dépose les tranches et laisse dorer 2 à 3 minutes sans y toucher, jusqu'à ce que le dessous soit bien doré et caramélisé.",
 "Retourne et laisse encore 2 minutes. L'intérieur doit être moelleux, comme un flan.",
 "Saupoudre d'une pincée de sucre dès la sortie de la poêle : il fond et fait une fine croûte."
],["C'est la recette parfaite pour finir du pain dur, brioche ou pain de mie.","Feu moyen, pas plus : le sucre brûle vite."],"À manger chaud, tout de suite.");
X("bircher","Un bocal ou un bol avec couvercle, une râpe.",[
 "La veille au soir, verse les flocons dans le bocal.",
 "Ajoute le yaourt, le lait et les raisins secs, puis mélange bien pour que tous les flocons soient mouillés.",
 "Ferme et mets au frigo toute la nuit, au moins 6 heures. Les flocons gonflent et deviennent crémeux, comme un riz au lait froid.",
 "Le matin, râpe la demi-pomme avec la peau, directement dans le bocal. Mélange vite pour qu'elle ne noircisse pas.",
 "Ajoute le miel et, si c'est trop épais, un trait de lait."
],["Tu peux préparer 3 bocaux d'un coup le dimanche : ils se gardent 3 jours.","Une pincée de cannelle ou quelques noix ajoutent du croquant."],"3 jours au frigo, sans la pomme (ajoute-la le matin même).");
X("tartine-avocat","Une petite casserole, une fourchette, une assiette, un grille-pain.",[
 "Porte une petite casserole d'eau à ébullition. Plonge l'œuf délicatement avec une cuillère et lance un minuteur de 6 minutes pour un jaune coulant (7 minutes pour un jaune juste pris).",
 "Pendant ce temps, coupe l'avocat en deux, retire le noyau et récupère la chair à la cuillère.",
 "Écrase-la à la fourchette dans une assiette avec quelques gouttes de citron, du sel et du poivre. Garde quelques morceaux pour la texture.",
 "Fais griller le pain.",
 "À la fin du minuteur, passe l'œuf sous l'eau froide 1 minute, puis écale-le en tapotant la coquille partout.",
 "Étale l'avocat sur le pain, pose l'œuf coupé en deux et termine par une pincée de piment et un tour de poivre."
],["Le citron empêche l'avocat de noircir.","Un avocat est mûr quand il cède légèrement sous le doigt, près de la queue."],"La demi-moitié d'avocat restante se garde 1 jour au frigo avec son noyau, filmée et arrosée de citron.");
X("fromage-blanc-noix","Un bol, un couteau.",[
 "Concasse grossièrement les noix au couteau, ou casse-les avec les doigts.",
 "Fais-les griller 2 minutes à sec dans une poêle chaude si tu as le temps : elles deviennent beaucoup plus parfumées.",
 "Verse le fromage blanc dans le bol.",
 "Ajoute la banane coupée en rondelles et les noix.",
 "Arrose de miel en filet."
],["Un fromage blanc à 3 % de matière grasse est plus crémeux et rassasie plus longtemps."],"À manger tout de suite.");
X("crepes","Un saladier, un fouet, une louche, une poêle à crêpes ou une grande poêle antiadhésive, une spatule.",[
 "Dans le saladier, mélange la farine, le sucre et une pincée de sel. Creuse un puits.",
 "Casse l'œuf au centre et commence à fouetter en versant un tiers du lait. Tu obtiens une pâte épaisse et lisse, sans grumeaux.",
 "Verse le reste du lait petit à petit en fouettant. La pâte doit avoir la consistance d'une crème liquide.",
 "Fais fondre le beurre et ajoute-le à la pâte. Laisse reposer 30 minutes si tu peux : les crêpes seront plus souples.",
 "Chauffe la poêle à feu moyen à vif et graisse-la avec un essuie-tout huilé.",
 "Verse une petite louche de pâte en inclinant la poêle dans tous les sens pour couvrir tout le fond d'une couche très fine.",
 "Laisse cuire 1 minute, jusqu'à ce que les bords se décollent et dorent. Retourne avec la spatule et laisse 30 secondes de l'autre côté.",
 "Empile les crêpes sur une assiette au fur et à mesure. Garnis de confiture et roule ou plie en quatre."
],["Si la pâte a des grumeaux, un coup de mixeur plongeant règle le problème.","La première crêpe sert à régler la poêle, c'est normal qu'elle soit moins belle."],"Les crêpes cuites se gardent 3 jours au frigo, filmées. Réchauffe-les 20 secondes à la poêle.");
X("omelette-herbes","Un bol, une fourchette, une poêle antiadhésive de 20 cm, une spatule.",[
 "Rince et sèche les herbes, puis cisèle-les aux ciseaux.",
 "Casse les œufs dans le bol, ajoute les herbes, sel et poivre, et bats 30 secondes à la fourchette.",
 "Fais fondre le beurre dans la poêle à feu moyen jusqu'à ce qu'il mousse.",
 "Verse les œufs. Pendant 1 minute, ramène les bords vers le centre avec la spatule et incline la poêle pour que l'œuf liquide coule sur les parties libres.",
 "Arrête de remuer quand le dessus est encore légèrement baveux. Laisse 30 secondes pour que le dessous prenne.",
 "Plie l'omelette en deux avec la spatule et fais-la glisser sur l'assiette. Sers avec le pain."
],["Une omelette se cuit vite : 2 minutes en tout, pas plus, sinon elle devient caoutchouteuse."],"À manger tout de suite.");
X("tartine-cacahuete","Un grille-pain, un couteau.",[
 "Fais griller le pain jusqu'à ce qu'il soit bien doré.",
 "Étale le beurre de cacahuète sur le pain encore chaud : il fond légèrement et s'étale mieux.",
 "Coupe la banane en rondelles fines et dispose-les en les faisant se chevaucher.",
 "Ajoute une pincée de cannelle ou un filet de miel si tu aimes."
],["Choisis un beurre de cacahuète sans sucre ajouté : la banane suffit à sucrer."],"À manger tout de suite.");
X("yaourt-pomme","Une petite poêle, une spatule, un couteau, un bol.",[
 "Épluche la pomme (ou garde la peau), retire le cœur et coupe-la en dés d'environ 1 cm.",
 "Fais fondre le beurre dans la poêle à feu moyen.",
 "Ajoute les dés de pomme, le sucre et la cannelle. Fais-les revenir 5 à 6 minutes en remuant de temps en temps, jusqu'à ce qu'ils soient tendres et légèrement caramélisés.",
 "Verse le yaourt dans le bol.",
 "Dépose les pommes chaudes par-dessus et termine par le granola."
],["Le contraste entre les pommes chaudes et le yaourt froid est tout l'intérêt de ce bol.","Les pommes poêlées se préparent la veille et se réchauffent 30 secondes au micro-ondes."],"Les pommes poêlées se gardent 3 jours au frigo.");
X("porridge-choco","Une petite casserole, une cuillère en bois, un bol.",[
 "Verse les flocons et le lait dans la casserole avec une pincée de sel.",
 "Porte à frémissement à feu moyen, puis baisse sur feu doux.",
 "Laisse cuire 4 à 5 minutes en remuant souvent, jusqu'à ce que le porridge soit épais et crémeux.",
 "Hors du feu, ajoute le chocolat cassé en petits morceaux. Attends 30 secondes puis mélange : il fond tout seul.",
 "Verse dans le bol et ajoute la banane en rondelles."
],["Garde un carré de chocolat pour le râper par-dessus au moment de servir."],"Se garde 2 jours au frigo ; réchauffe avec un trait de lait.");
X("oeuf-coque","Une petite casserole, une cuillère, un minuteur, des coquetiers.",[
 "Sors les œufs du frigo 10 minutes avant : un œuf froid plongé dans l'eau bouillante risque de se fendre.",
 "Porte de l'eau à ébullition dans la casserole, en quantité suffisante pour couvrir les œufs.",
 "Dépose les œufs un par un avec une cuillère et lance un minuteur de 3 minutes dès qu'ils touchent l'eau. Garde une ébullition douce.",
 "Pendant ce temps, coupe le pain en bâtonnets, fais-les griller et beurre-les.",
 "Sors les œufs, pose-les dans les coquetiers et coupe le haut d'un coup de couteau sec.",
 "Sale le jaune et trempe les mouillettes."
],["3 minutes donnent un blanc juste pris et un jaune liquide ; 4 minutes, un jaune un peu plus épais."],"À manger tout de suite.");
X("muesli-maison","Un bol, un couteau.",[
 "Mélange dans le bol les flocons, les raisins secs et les noix concassées.",
 "Coupe la demi-pomme en petits dés et ajoute-la.",
 "Verse le lait froid juste avant de manger.",
 "Laisse reposer 2 minutes si tu préfères les flocons un peu plus tendres."
],["Prépare un grand bocal du mélange sec (flocons, raisins, noix) : il se garde 1 mois au placard."],"Le mélange sec se garde 1 mois dans un bocal fermé.");

X("salade-nicoise","Une grande casserole, une écumoire, un saladier, une petite boîte pour la vinaigrette.",[
 "Lave les pommes de terre sans les éplucher et mets-les dans la casserole d'eau froide salée. Porte à ébullition puis compte 15 à 18 minutes à feu moyen.",
 "7 minutes avant la fin, ajoute les haricots verts surgelés directement dans la même eau.",
 "En même temps, dépose délicatement l'œuf dans l'eau avec une cuillère : il lui faut 9 minutes pour être dur.",
 "Vérifie la cuisson des pommes de terre avec la pointe d'un couteau : elle doit entrer sans résistance. Égoutte tout et passe sous l'eau froide pour stopper la cuisson.",
 "Écale l'œuf et coupe-le en quartiers. Épluche les pommes de terre si tu veux et coupe-les en morceaux.",
 "Lave la salade, coupe les tomates en quartiers et émince finement l'oignon rouge.",
 "Prépare la vinaigrette : une pincée de sel dans le vinaigre, mélange pour la dissoudre, puis ajoute l'huile d'olive et du poivre.",
 "Dresse la salade au fond de l'assiette, puis les pommes de terre, les haricots, les tomates, le thon émietté, l'œuf et les olives. Arrose de vinaigrette juste avant de manger."
],["Assaisonne les pommes de terre encore tièdes avec un peu de vinaigrette : elles l'absorbent et prennent beaucoup plus de goût.","Une anchois ou deux, si tu aimes, c'est la version traditionnelle."],"Sans la salade verte ni la vinaigrette, se garde 2 jours au frigo dans une boîte : parfait pour le midi.");
X("salade-pates-thon","Une grande casserole, une passoire, un saladier.",[
 "Porte une grande casserole d'eau à ébullition, sale-la bien (une cuillère à soupe de gros sel pour 2 litres).",
 "Verse les pâtes et cuis-les 1 minute de plus que le temps indiqué sur le paquet : froides, elles durcissent un peu.",
 "Égoutte et rince sous l'eau froide jusqu'à ce qu'elles soient complètement froides. Égoutte encore bien.",
 "Pendant la cuisson, égoutte le thon et le maïs, et coupe les tomates en petits dés (retire les graines si elles sont très juteuses).",
 "Dans le saladier, mélange les pâtes avec la mayonnaise, puis ajoute le thon émietté, le maïs et les tomates.",
 "Ajoute la ciboulette ciselée, sale, poivre et goûte. Laisse au frais au moins 20 minutes avant de servir."
],["Un filet de jus de citron ou un trait de vinaigre dans la mayonnaise allège le tout.","Ajoute quelques dés de concombre pour du croquant."],"2 jours au frigo dans une boîte fermée. Idéal à emporter le midi.");
X("salade-lentilles","Une casserole, une passoire, une petite casserole pour l'œuf, un saladier.",[
 "Rince les lentilles dans une passoire et retire les éventuels petits cailloux.",
 "Mets-les dans la casserole avec trois fois leur volume d'eau froide, sans sel (le sel en début de cuisson durcit la peau). Ajoute la carotte coupée en petits dés.",
 "Porte à ébullition, puis laisse frémir 20 à 25 minutes à feu doux. Goûte : elles doivent être tendres mais encore entières.",
 "Pendant ce temps, fais cuire l'œuf 9 minutes dans l'eau bouillante, refroidis-le et écale-le.",
 "Prépare la vinaigrette dans le saladier : l'échalote hachée finement, la moutarde, le vinaigre, une pincée de sel. Mélange, puis ajoute l'huile en fouettant.",
 "Égoutte les lentilles, sale-les, et verse-les encore tièdes dans la vinaigrette. Mélange : tièdes, elles absorbent mieux l'assaisonnement.",
 "Ajoute le persil haché, laisse tiédir ou refroidir, et dépose l'œuf coupé en quartiers au moment de servir."
],["Laisse l'échalote 5 minutes dans le vinaigre avant d'ajouter l'huile : elle perd son goût piquant."],"3 jours au frigo sans l'œuf. Elle est même meilleure le lendemain.");
X("salade-riz","Une casserole, une passoire, un saladier.",[
 "Rince le riz à l'eau froide jusqu'à ce que l'eau soit claire.",
 "Fais-le cuire dans un grand volume d'eau bouillante salée, comme des pâtes, environ 11 minutes (vérifie le paquet). Ajoute l'œuf dans la même eau pour 9 minutes.",
 "Égoutte le riz, rince-le sous l'eau froide et égoutte-le très bien. Refroidis l'œuf et écale-le.",
 "Coupe les tomates en dés, égoutte le thon et le maïs, et coupe les olives en rondelles.",
 "Mélange l'huile, le vinaigre, le sel et le poivre dans le saladier.",
 "Ajoute le riz froid, puis le reste des ingrédients, et mélange délicatement. Termine par l'œuf en morceaux."
],["Un riz bien refroidi et bien égoutté reste en grains bien séparés."],"2 jours au frigo dans une boîte fermée.");
X("salade-chevre","Une plaque de four, du papier cuisson, un saladier.",[
 "Allume le four en position gril (ou à 220 °C si tu n'as pas de gril).",
 "Coupe la baguette en tranches d'environ 1 cm, en biais, et pose-les sur la plaque recouverte de papier cuisson.",
 "Coupe la bûche de chèvre en rondelles d'environ 1,5 cm et pose-en une sur chaque tranche. Ajoute une goutte de miel et un tour de poivre.",
 "Enfourne en haut du four pour 4 à 6 minutes. Surveille : le chèvre doit dorer et commencer à fondre, sans couler.",
 "Pendant ce temps, lave et essore la salade, coupe les tomates cerises en deux et concasse les noix.",
 "Prépare une vinaigrette rapide dans le saladier : vinaigre, sel, poivre, puis l'huile. Mélange la salade dedans au dernier moment.",
 "Dresse la salade, ajoute les tomates et les noix, et pose les toasts tout chauds par-dessus."
],["Fais griller les noix 2 minutes à sec dans une poêle : elles sont bien plus parfumées."],"Les toasts se mangent chauds, tout de suite.");
X("croque-monsieur","Une poêle (ou un four), une spatule, un couteau.",[
 "Pose deux tranches de pain de mie sur le plan de travail. Beurre-les fin d'un seul côté, ce sera l'extérieur.",
 "Retourne une tranche (côté beurré dessous) et pose dessus une tranche de jambon pliée à la taille du pain et la moitié du fromage.",
 "Recouvre avec l'autre tranche, côté beurré vers l'extérieur. Recommence pour le second croque si besoin.",
 "Chauffe la poêle à feu moyen, sans matière grasse. Pose le croque et presse-le légèrement avec la spatule.",
 "Laisse dorer 3 minutes, puis retourne-le délicatement. Parsème le reste du fromage dessus et couvre la poêle 2 à 3 minutes pour que le fromage fonde.",
 "Coupe en deux en diagonale et sers avec un peu de salade assaisonnée."
],["Au four : 10 minutes à 200 °C, avec le fromage par-dessus pour gratiner.","Une fine couche de moutarde à l'intérieur relève le jambon."],"À manger tout de suite.");
X("pan-bagnat","Une petite casserole, un couteau à pain.",[
 "Fais cuire l'œuf 9 minutes dans l'eau bouillante, refroidis-le et coupe-le en rondelles.",
 "Coupe le pain en deux dans l'épaisseur sans aller jusqu'au bout, pour qu'il reste attaché d'un côté.",
 "Retire un peu de mie de chaque côté pour faire de la place à la garniture.",
 "Arrose généreusement l'intérieur d'huile d'olive : c'est ce qui fait le pan-bagnat.",
 "Dispose la salade, les tomates en rondelles salées, le thon émietté, l'œuf et les olives coupées.",
 "Referme bien, enveloppe dans du papier ou un film, et pose un poids dessus (une planche, un livre) 15 minutes. Le pain s'imbibe du jus des tomates et de l'huile."
],["Il est encore meilleur préparé le matin pour le midi."],"À manger dans la journée.");
X("quiche-lorraine","Un moule à tarte, une poêle, un saladier, un fouet, une fourchette.",[
 "Préchauffe le four à 200 °C, chaleur tournante si possible.",
 "Déroule la pâte dans le moule en gardant son papier dessous. Pique le fond partout avec une fourchette pour qu'il ne gonfle pas.",
 "Fais revenir les lardons à sec dans la poêle à feu moyen pendant 5 minutes, jusqu'à ce qu'ils soient légèrement dorés. Égoutte-les sur un essuie-tout pour retirer le gras.",
 "Dans le saladier, fouette les œufs avec la crème, le lait, la muscade et du poivre. Sale très peu : les lardons sont déjà salés.",
 "Répartis les lardons sur le fond de pâte, verse l'appareil aux œufs et parsème de fromage.",
 "Enfourne 30 à 35 minutes, sur la grille du bas, jusqu'à ce que la quiche soit bien dorée et gonflée, et que le centre ne tremble plus quand tu bouges le moule.",
 "Laisse reposer 5 minutes avant de couper : elle se tient mieux. Sers avec une salade."
],["Cuire sur la grille du bas donne une pâte bien croustillante dessous.","La recette lorraine d'origine n'a pas de fromage : à toi de voir."],"3 jours au frigo. Réchauffe 10 minutes au four à 180 °C, pas au micro-ondes, pour garder la pâte croustillante.");
X("quiche-poireaux","Un moule à tarte, une poêle, un saladier, un fouet.",[
 "Préchauffe le four à 200 °C.",
 "Coupe le vert foncé et la racine des poireaux. Fends-les en deux dans la longueur et rince-les bien sous l'eau, en écartant les feuilles : la terre se cache entre elles.",
 "Émince-les finement. Fais fondre le beurre dans la poêle, ajoute les poireaux et une pincée de sel. Laisse-les fondre 10 à 12 minutes à feu doux en remuant : ils doivent être tendres, sans colorer.",
 "Déroule la pâte dans le moule et pique le fond.",
 "Fouette les œufs avec la crème, le lait, sel, poivre et un peu de muscade.",
 "Répartis les poireaux sur la pâte, verse l'appareil et parsème de fromage.",
 "Enfourne 30 à 35 minutes, jusqu'à ce que le dessus soit doré et que le centre soit pris."
],["Laisse bien évaporer l'eau des poireaux, sinon la quiche sera détrempée.","Une poignée de lardons ou de saumon fumé l'accompagne très bien."],"3 jours au frigo. Réchauffe au four.");
X("tarte-tomate","Un moule à tarte, un couteau bien aiguisé, un essuie-tout.",[
 "Préchauffe le four à 200 °C.",
 "Coupe les tomates en rondelles d'environ 5 mm. Pose-les sur un essuie-tout, sale-les légèrement et laisse-les rendre leur eau 10 minutes.",
 "Déroule la pâte dans le moule et pique le fond à la fourchette.",
 "Étale la moutarde au pinceau ou au dos d'une cuillère sur tout le fond : elle protège la pâte du jus des tomates.",
 "Parsème de fromage, puis dispose les rondelles de tomates en rosace en les faisant se chevaucher.",
 "Saupoudre d'herbes de Provence, poivre et arrose d'un filet d'huile d'olive.",
 "Enfourne 30 minutes, jusqu'à ce que les bords de la pâte soient bien dorés et les tomates légèrement confites."
],["Les tomates bien mûres de l'été donnent la meilleure tarte.","Tiède ou froide, elle est encore meilleure qu'à la sortie du four."],"2 jours au frigo.");
X("hachis-parmentier","Une grande casserole, une poêle, un presse-purée ou une fourchette, un plat à gratin.",[
 "Épluche les pommes de terre et coupe-les en gros morceaux de même taille. Mets-les dans la casserole d'eau froide salée et porte à ébullition. Compte 20 minutes : la pointe d'un couteau doit s'enfoncer sans résistance.",
 "Pendant ce temps, épluche et hache finement l'oignon. Fais-le revenir 3 minutes dans un filet d'huile à feu moyen jusqu'à ce qu'il soit translucide.",
 "Ajoute la viande hachée, monte le feu et fais-la dorer 5 minutes en l'émiettant à la spatule. Sale, poivre.",
 "Préchauffe le four à 210 °C.",
 "Égoutte les pommes de terre et écrase-les aussitôt. Ajoute le beurre, puis le lait chaud petit à petit en mélangeant, jusqu'à obtenir une purée lisse. Sale et ajoute un peu de muscade.",
 "Étale la viande au fond du plat, couvre de purée et lisse avec le dos d'une fourchette en faisant des sillons : ils doreront joliment.",
 "Parsème de fromage et enfourne 15 à 20 minutes, jusqu'à ce que le dessus soit bien gratiné."
],["Le lait doit être chaud : froid, il rend la purée collante.","Un reste de bœuf bourguignon ou de pot-au-feu fait le meilleur hachis."],"3 jours au frigo, 3 mois au congélateur. Réchauffe au four à 180 °C, 20 minutes.");
X("gratin-pdt-jambon","Un plat à gratin, une casserole, un couteau bien aiguisé ou une mandoline.",[
 "Préchauffe le four à 180 °C.",
 "Épluche les pommes de terre et coupe-les en rondelles très fines, 2 à 3 mm. Ne les rince pas : leur amidon va lier la sauce.",
 "Coupe la gousse d'ail en deux et frotte-en tout l'intérieur du plat. Beurre le plat.",
 "Dans la casserole, fais chauffer la crème et le lait avec la muscade, du sel et du poivre, jusqu'aux premiers frémissements.",
 "Dispose une couche de pommes de terre qui se chevauchent, quelques lanières de jambon, puis recommence jusqu'à épuisement.",
 "Verse le mélange chaud : il doit arriver juste au niveau des pommes de terre. Parsème de fromage.",
 "Enfourne 50 minutes à 1 heure, jusqu'à ce que le dessus soit bien doré et que la pointe d'un couteau traverse le gratin sans résistance."
],["Si le dessus dore trop vite, couvre-le d'une feuille d'aluminium.","Laisse reposer 10 minutes avant de servir : la sauce épaissit."],"3 jours au frigo. Se réchauffe très bien au four.");
X("poulet-roti-pdt","Un grand plat allant au four, un couteau.",[
 "Sors le poulet du frigo 20 minutes avant pour qu'il cuise régulièrement. Préchauffe le four à 200 °C.",
 "Lave les pommes de terre et coupe-les en quartiers sans les éplucher.",
 "Mets-les dans le plat avec les gousses d'ail entières non épluchées, la moitié de l'huile, la moitié des herbes, du sel et du poivre. Mélange avec les mains.",
 "Sèche la peau du poulet avec un essuie-tout : c'est ce qui la rendra croustillante. Frotte-la avec le reste d'huile, d'herbes, de sel et de poivre.",
 "Pose les morceaux de poulet sur les pommes de terre, peau vers le haut.",
 "Enfourne pour 45 minutes. À mi-cuisson, retourne les pommes de terre et arrose le poulet avec son jus.",
 "Vérifie la cuisson : en piquant près de l'os, le jus doit être transparent, pas rosé. Les pommes de terre doivent être dorées.",
 "Écrase les gousses d'ail confites et étale-les sur les pommes de terre au moment de servir."
],["Les hauts de cuisse ne sèchent pas, même un peu trop cuits : c'est le morceau le plus facile.","Un filet de jus de citron sur le poulet à la sortie du four le réveille."],"3 jours au frigo. Le reste de poulet fait un super sandwich le lendemain.");
X("blanquette-dinde","Une cocotte ou une sauteuse avec couvercle, une casserole pour le riz.",[
 "Coupe la dinde en cubes d'environ 3 cm. Épluche les carottes et coupe-les en rondelles. Nettoie les champignons et coupe-les en quatre.",
 "Fais fondre le beurre dans la cocotte à feu moyen. Ajoute la dinde et fais-la revenir 3 à 4 minutes : elle doit blanchir sur toutes les faces, sans dorer (c'est une blanquette, elle reste blanche).",
 "Saupoudre la farine sur la viande et mélange 1 minute pour la cuire.",
 "Délaye le cube de bouillon dans un grand verre d'eau chaude et verse-le petit à petit en remuant. La sauce épaissit.",
 "Ajoute les carottes, couvre et laisse mijoter 15 minutes à feu doux.",
 "Ajoute les champignons et poursuis 10 minutes à découvert.",
 "Lance la cuisson du riz pendant ce temps.",
 "Hors du feu, incorpore la crème, goûte, rectifie le sel et le poivre. Sers avec le riz."
],["Un filet de jus de citron juste avant de servir donne le goût des blanquettes de grand-mère.","Ne fais plus bouillir après avoir mis la crème, sinon elle peut trancher."],"3 jours au frigo, 2 mois au congélateur (sans le riz).");
X("bourguignon","Une cocotte en fonte ou un grand faitout avec couvercle, une écumoire.",[
 "Coupe la viande en gros cubes d'environ 4 cm et sèche-les avec un essuie-tout : une viande humide ne dore pas, elle bout.",
 "Chauffe un filet d'huile dans la cocotte à feu vif. Fais dorer les morceaux en plusieurs fois, sans les entasser, 2 à 3 minutes par face. Réserve-les dans une assiette.",
 "Baisse le feu à moyen. Fais revenir les lardons et l'oignon émincé 5 minutes dans la même cocotte, en grattant les sucs au fond.",
 "Remets la viande avec son jus, saupoudre de farine et mélange 1 minute. Ajoute le concentré de tomate.",
 "Verse le bouillon dilué dans de l'eau chaude (un verre de vin rouge si tu en as) jusqu'à couvrir la viande à hauteur. Ajoute le thym, sale légèrement et poivre.",
 "Porte à frémissement, couvre et laisse mijoter 2 heures à feu très doux. Le liquide doit à peine trembler.",
 "Au bout d'1 heure, ajoute les carottes en rondelles. 20 minutes avant la fin, ajoute les champignons.",
 "Pendant les 20 dernières minutes, fais cuire les pommes de terre à l'eau salée. La viande est prête quand elle se défait à la fourchette. Si la sauce est trop liquide, laisse-la réduire à découvert 10 minutes."
],["C'est encore meilleur réchauffé le lendemain : fais-en le double.","Plus le feu est doux, plus la viande est fondante."],"4 jours au frigo, 3 mois au congélateur.");
X("saucisses-lentilles","Une cocotte avec couvercle.",[
 "Pique les saucisses 2 ou 3 fois avec une fourchette pour qu'elles n'éclatent pas.",
 "Fais-les dorer dans la cocotte à feu moyen, sans matière grasse, 5 minutes en les retournant. Réserve-les.",
 "Dans la graisse rendue, fais revenir l'oignon émincé et les carottes en rondelles 5 minutes.",
 "Rince les lentilles et ajoute-les dans la cocotte avec le cube de bouillon émietté et le thym.",
 "Verse de l'eau jusqu'à couvrir les lentilles de 3 cm environ.",
 "Remets les saucisses, couvre et laisse mijoter 30 minutes à feu doux. Ajoute un peu d'eau si les lentilles absorbent tout.",
 "Les lentilles sont prêtes quand elles sont fondantes mais encore entières. Goûte et rectifie le sel."
],["Une cuillère de moutarde mélangée aux lentilles en fin de cuisson est un classique."],"3 jours au frigo, 3 mois au congélateur.");
X("tartiflette","Une casserole, une poêle, un plat à gratin.",[
 "Lave les pommes de terre et fais-les cuire entières dans l'eau salée 15 minutes : elles doivent rester un peu fermes.",
 "Égoutte, laisse tiédir 5 minutes, épluche-les et coupe-les en rondelles épaisses.",
 "Préchauffe le four à 200 °C.",
 "Dans la poêle, fais revenir les lardons et l'oignon émincé 8 minutes à feu moyen, jusqu'à ce que l'oignon soit doré.",
 "Mélange délicatement les pommes de terre avec les lardons, l'oignon et la crème, poivre (pas de sel : le fromage et les lardons sont salés).",
 "Verse dans le plat. Gratte légèrement la croûte du reblochon sans la retirer, coupe-le en deux dans l'épaisseur et pose-le dessus, croûte vers le haut.",
 "Enfourne 20 à 25 minutes, jusqu'à ce que le fromage ait fondu et coule dans les pommes de terre, avec une croûte dorée."
],["Un verre de vin blanc versé sur les oignons en fin de cuisson, c'est la vraie recette savoyarde.","Sers avec une salade verte bien vinaigrée pour équilibrer."],"2 jours au frigo. Réchauffe au four.");
X("omelette-paysanne","Une poêle antiadhésive avec couvercle, un bol.",[
 "Épluche les pommes de terre et coupe-les en petits dés de 1 cm. Sèche-les dans un torchon.",
 "Chauffe l'huile dans la poêle à feu moyen et fais dorer les dés 10 minutes en remuant de temps en temps. Ils doivent être dorés et tendres.",
 "Ajoute les lardons et l'oignon émincé, et poursuis 5 minutes.",
 "Bats les œufs avec le persil, poivre et très peu de sel.",
 "Verse les œufs sur la garniture, baisse le feu et couvre. Laisse cuire 5 à 6 minutes sans remuer.",
 "L'omelette est prête quand le dessus est pris. Fais-la glisser sur une assiette et coupe-la en parts."
],["Couvrir la poêle permet de cuire le dessus sans avoir à retourner l'omelette."],"1 jour au frigo ; elle se mange aussi froide.");
X("soupe-legumes","Un grand faitout, un éplucheur, un mixeur plongeant.",[
 "Épluche les carottes et les pommes de terre. Coupe le vert et la racine du poireau, fends-le et rince-le bien.",
 "Coupe tous les légumes en morceaux d'environ 2 cm : de même taille, ils cuisent en même temps.",
 "Mets-les dans le faitout avec le cube de bouillon émietté et couvre d'eau à hauteur, pas plus : une soupe trop liquide manque de goût.",
 "Porte à ébullition, puis baisse le feu, couvre et laisse cuire 25 minutes. Les légumes doivent s'écraser facilement.",
 "Mixe longuement, au moins 1 minute, pour obtenir une soupe bien lisse. Ajoute un peu d'eau chaude si elle est trop épaisse.",
 "Ajoute la crème, goûte, sale et poivre. Sers avec du pain grillé."
],["Fais revenir les légumes 5 minutes dans un peu de beurre avant d'ajouter l'eau : la soupe aura bien plus de goût.","Les fanes de carottes ou les restes de légumes du frigo y ont toute leur place."],"4 jours au frigo, 3 mois au congélateur en portions.");
X("veloute-potiron","Un faitout, un grand couteau, un mixeur plongeant.",[
 "Coupe la courge en deux avec un grand couteau, retire les graines à la cuillère, puis épluche-la avec un éplucheur et coupe-la en cubes.",
 "Épluche la pomme de terre et coupe-la en cubes. Émince l'oignon.",
 "Fais revenir l'oignon 3 minutes dans un filet d'huile au fond du faitout, sans colorer.",
 "Ajoute la courge et la pomme de terre, mélange 2 minutes, puis le bouillon émietté et de l'eau juste à hauteur.",
 "Couvre et laisse cuire 20 à 25 minutes, jusqu'à ce que la courge soit fondante.",
 "Mixe avec la crème et une pincée de muscade jusqu'à ce que ce soit velouté. Sale, poivre.",
 "Sers bien chaud avec du pain grillé."
],["La butternut s'épluche bien plus facilement que le potimarron… mais le potimarron se mange avec sa peau, pas besoin de l'éplucher.","Quelques graines de courge grillées à la poêle font un joli croquant."],"4 jours au frigo, 3 mois au congélateur.");
X("steak-frites","Une plaque de four, une poêle épaisse, une pince ou une spatule.",[
 "Préchauffe le four à la température indiquée sur le sachet de frites (souvent 220 °C). Étale les frites en une seule couche sur la plaque et enfourne pour environ 20 minutes, en les retournant à mi-cuisson.",
 "Sors la viande du frigo 15 minutes avant de la cuire.",
 "Façonne un steak d'environ 2 cm d'épaisseur sans trop tasser la viande, avec un petit creux au centre (il évite qu'il gonfle).",
 "Chauffe la poêle à feu vif avec un filet d'huile. Elle doit être très chaude.",
 "Pose le steak et n'y touche plus pendant 2 à 3 minutes, jusqu'à ce qu'une croûte se forme. Retourne-le une seule fois.",
 "Compte 2 minutes de l'autre côté pour saignant, 3 pour à point. Sale et poivre seulement à la fin.",
 "Pendant ce temps, assaisonne la salade. Sers le steak avec les frites salées à la sortie du four."
],["Ne presse jamais le steak dans la poêle : tu en fais sortir tout le jus."],"À manger tout de suite.");
X("escalope-creme","Une poêle ou sauteuse, une casserole pour le riz.",[
 "Lance la cuisson du riz.",
 "Nettoie les champignons avec un essuie-tout humide (ne les fais pas tremper) et émince-les. Hache l'échalote.",
 "Sèche les escalopes, sale et poivre-les.",
 "Fais fondre le beurre dans la poêle à feu moyen à vif. Quand il mousse, dépose les escalopes et fais-les dorer 3 à 4 minutes de chaque côté. Réserve-les sur une assiette sous une feuille d'aluminium.",
 "Dans la même poêle, sans la laver, fais revenir l'échalote 1 minute, puis les champignons 5 à 6 minutes, jusqu'à ce qu'ils aient rendu leur eau et commencent à dorer.",
 "Verse la crème, mélange en grattant les sucs du fond, et laisse épaissir 2 minutes.",
 "Remets les escalopes et leur jus dans la sauce 1 minute pour les réchauffer. Sers avec le riz."
],["Les sucs de cuisson de la viande au fond de la poêle donnent tout son goût à la sauce : ne les jette pas."],"2 jours au frigo.");
X("poulet-moutarde","Une poêle avec couvercle, une casserole.",[
 "Porte une casserole d'eau salée à ébullition et fais-y cuire les haricots verts 8 à 10 minutes. Ils doivent rester légèrement croquants. Égoutte.",
 "Coupe le poulet en morceaux de 3 cm. Sale et poivre.",
 "Chauffe l'huile dans la poêle à feu moyen à vif et fais dorer le poulet 5 à 6 minutes, en le retournant.",
 "Baisse le feu, ajoute la moutarde et la crème, et mélange bien.",
 "Laisse mijoter 3 minutes à couvert, jusqu'à ce que la sauce nappe le poulet et que la viande soit cuite à cœur (plus du tout rosée à l'intérieur).",
 "Sers avec les haricots verts, éventuellement passés 1 minute dans la sauce."
],["La moutarde à l'ancienne, en grains, donne une sauce plus rustique.","Ne fais pas bouillir fort après la moutarde : elle devient amère."],"2 jours au frigo.");
X("gratin-courgettes","Une poêle, un plat à gratin, un bol, une casserole pour le riz.",[
 "Préchauffe le four à 200 °C et lance le riz.",
 "Lave les courgettes, coupe les extrémités et taille-les en rondelles de 5 mm.",
 "Chauffe l'huile d'olive dans la poêle à feu moyen. Fais revenir les courgettes avec l'ail haché 8 à 10 minutes : elles doivent rendre leur eau et légèrement dorer. Sale.",
 "Égoutte-les bien dans une passoire 2 minutes : c'est l'eau des courgettes qui rend un gratin liquide.",
 "Bats l'œuf avec la crème, sel et poivre.",
 "Étale les courgettes dans le plat, verse l'appareil et parsème de fromage.",
 "Enfourne 20 à 25 minutes, jusqu'à ce que le dessus soit doré et que l'appareil soit pris. Sers avec le riz."
],["Quelques feuilles de basilic ou une pincée de thym dans l'appareil lui donnent un air de Provence."],"3 jours au frigo.");
X("ratatouille","Un grand faitout ou une cocotte, une planche, un bon couteau.",[
 "Lave tous les légumes. Coupe l'aubergine, les courgettes et le poivron en dés d'environ 2 cm. Émince l'oignon et hache l'ail. Coupe les tomates en morceaux.",
 "Chauffe la moitié de l'huile dans le faitout à feu moyen. Fais revenir l'oignon et le poivron 5 minutes.",
 "Ajoute l'aubergine avec le reste d'huile (elle en absorbe beaucoup) et fais-la revenir 5 minutes en remuant.",
 "Ajoute les courgettes et l'ail, et poursuis 5 minutes.",
 "Ajoute les tomates, les herbes de Provence, du sel et du poivre. Mélange.",
 "Couvre et laisse mijoter 35 minutes à feu doux, en remuant de temps en temps. Retire le couvercle les 10 dernières minutes si c'est trop liquide.",
 "Pendant ce temps, fais cuire le riz. Goûte la ratatouille, rectifie l'assaisonnement et sers."
],["La ratatouille est encore meilleure le lendemain, et elle se mange chaude, tiède ou froide.","Fais-en le double : elle se congèle très bien."],"4 jours au frigo, 3 mois au congélateur.");

X("endives-jambon","Une casserole, une passoire, une petite casserole pour la sauce, un fouet, un plat à gratin.",[
 "Retire les premières feuilles abîmées des endives et creuse un petit cône à la base avec la pointe d'un couteau : c'est la partie la plus amère.",
 "Plonge-les dans l'eau bouillante salée avec un trait de jus de citron si tu en as, et cuis 15 minutes.",
 "Égoutte-les la tête en bas, puis presse-les doucement dans un torchon : elles retiennent beaucoup d'eau.",
 "Préchauffe le four à 200 °C.",
 "Béchamel : fais fondre le beurre dans la petite casserole, ajoute la farine et remue 1 minute à feu moyen. Verse le lait froid d'un coup en fouettant sans arrêt, jusqu'à ce que la sauce épaississe (3 à 4 minutes). Sale, poivre, ajoute la muscade.",
 "Roule chaque endive dans une tranche de jambon et range-les serrées dans le plat beurré.",
 "Nappe de béchamel, parsème de fromage et enfourne 20 minutes, jusqu'à ce que ce soit bien gratiné."
],["Une pincée de sucre dans l'eau de cuisson adoucit l'amertume des endives."],"3 jours au frigo.");
X("coquillettes-jambon","Une casserole, une passoire.",[
 "Porte un grand volume d'eau à ébullition et sale-la.",
 "Verse les coquillettes et cuis-les le temps indiqué sur le paquet, en remuant au début pour qu'elles ne collent pas.",
 "Pendant ce temps, coupe le jambon en petits carrés.",
 "Garde une demi-tasse d'eau de cuisson, puis égoutte les pâtes.",
 "Remets-les dans la casserole chaude, hors du feu, avec le beurre, le jambon et le fromage. Mélange vivement : le fromage fond et file.",
 "Si c'est un peu sec, ajoute une ou deux cuillères d'eau de cuisson. Poivre et sers aussitôt."
],["Le plat réconfort par excellence : une cuillère de crème le rend encore plus gourmand."],"2 jours au frigo ; réchauffe avec un trait d'eau.");
X("saumon-papillote","Une plaque, du papier cuisson, une poêle, une casserole pour le riz.",[
 "Préchauffe le four à 200 °C et lance la cuisson du riz.",
 "Nettoie le poireau, coupe-le en fines rondelles et fais-le fondre 5 minutes dans le beurre à feu doux, avec une pincée de sel.",
 "Découpe une grande feuille de papier cuisson pour chaque personne.",
 "Au centre, dépose un lit de poireaux, puis le pavé de saumon, peau dessous. Sale, poivre.",
 "Ajoute une cuillère de crème et une rondelle de citron sur le poisson.",
 "Referme la papillote en rabattant les bords et en les pliant plusieurs fois sur eux-mêmes : elle doit être bien étanche pour que le poisson cuise dans sa vapeur.",
 "Enfourne 15 minutes. Ouvre la papillote à table, attention à la vapeur chaude, et sers avec le riz."
],["Le saumon est parfait quand le centre est encore légèrement rosé : il se défait en lamelles nacrées."],"1 jour au frigo.");
X("colin-citron","Une casserole ou un panier vapeur, une poêle antiadhésive, une spatule souple.",[
 "Épluche les pommes de terre, coupe-les en deux si elles sont grosses, et cuis-les 20 minutes à l'eau salée ou à la vapeur.",
 "Si le colin est surgelé, fais-le décongeler la veille au frigo, ou 1 heure dans un sac fermé plongé dans l'eau froide. Sèche-le bien avec un essuie-tout.",
 "Sale et poivre les filets. Chauffe la moitié du beurre dans la poêle à feu moyen.",
 "Fais cuire le poisson 3 à 4 minutes de chaque côté, en le retournant une seule fois et délicatement : il est fragile. Il est cuit quand la chair devient blanche et se détache en feuillets.",
 "Dépose le poisson dans l'assiette. Ajoute le reste du beurre dans la poêle, laisse-le mousser et prendre une couleur noisette, puis le jus de citron et le persil haché.",
 "Verse ce beurre citronné bien chaud sur le poisson et les pommes de terre."
],["Un poisson bien sec avant cuisson dore au lieu de bouillir."],"1 jour au frigo.");
X("parmentier-poisson","Une casserole, une sauteuse, un presse-purée, un plat à gratin.",[
 "Épluche et coupe les pommes de terre, puis cuis-les 20 minutes à l'eau salée.",
 "Dans une sauteuse, porte de l'eau à frémissement (sans bouillir) et fais pocher le poisson 8 minutes.",
 "Égoutte-le et émiette-le à la fourchette en retirant les éventuelles arêtes. Mélange-le avec l'ail haché, le persil et un filet d'huile d'olive.",
 "Préchauffe le four à 210 °C.",
 "Prépare la purée : écrase les pommes de terre avec le beurre et le lait chaud. Sale et poivre.",
 "Étale le poisson dans le plat, couvre de purée, parsème de fromage.",
 "Enfourne 15 à 20 minutes, jusqu'à ce que le dessus soit doré."
],["Un peu de zeste de citron dans la purée se marie très bien avec le poisson."],"2 jours au frigo.");
X("moules-frites","Une grande cocotte avec couvercle, une plaque de four, une passoire.",[
 "Préchauffe le four pour les frites et enfourne-les dès qu'il est chaud (environ 20 minutes).",
 "Rince les moules dans une passoire sous l'eau froide. Gratte les impuretés et tire sur le petit filament (la barbe) pour l'arracher.",
 "Jette les moules cassées et celles qui restent ouvertes quand tu tapes dessus : elles ne sont plus bonnes.",
 "Hache l'échalote et le persil.",
 "Dans la cocotte, fais fondre le beurre à feu moyen et fais revenir l'échalote 2 minutes.",
 "Monte le feu au maximum, verse les moules et couvre. Laisse cuire 6 à 8 minutes en secouant la cocotte 2 ou 3 fois, couvercle tenu.",
 "Dès que toutes les moules sont ouvertes, ajoute la crème et le persil, mélange et coupe le feu. Jette celles qui sont restées fermées.",
 "Sers dans un grand bol avec le jus, et les frites à côté."
],["Un verre de vin blanc versé avec les moules donne les vraies moules marinières.","Ne sale pas : les moules rendent une eau déjà salée."],"À manger tout de suite.");
X("galette-complete","Un saladier, un fouet, une louche, une grande poêle antiadhésive ou une crêpière.",[
 "Dans le saladier, mets la farine de sarrasin et une pincée de sel. Verse environ 150 ml d'eau froide par personne petit à petit en fouettant.",
 "La pâte doit être lisse et un peu plus épaisse qu'une pâte à crêpes. Laisse-la reposer au moins 30 minutes, idéalement 1 heure.",
 "Chauffe la poêle à feu vif et graisse-la avec un peu de beurre.",
 "Verse une louche de pâte et étale-la vite en inclinant la poêle. Laisse cuire 1 à 2 minutes, jusqu'à ce que les bords se soulèvent.",
 "Retourne la galette et baisse à feu moyen. Parsème de fromage, pose le jambon et casse l'œuf au centre.",
 "Couvre 2 à 3 minutes, le temps que le blanc soit cuit et le jaune encore coulant.",
 "Replie les quatre bords vers le centre pour former un carré, en laissant le jaune visible. Ajoute une noisette de beurre et sers."
],["La pâte à galette s'améliore avec le temps : préparée la veille, elle est encore meilleure."],"La pâte se garde 2 jours au frigo.");
X("poulet-basquaise","Une cocotte avec couvercle, une casserole pour le riz.",[
 "Sale et poivre le poulet. Chauffe l'huile dans la cocotte à feu vif et fais dorer les morceaux côté peau 5 minutes, puis 3 minutes de l'autre côté. Réserve-les.",
 "Coupe les poivrons en lanières et émince l'oignon.",
 "Dans la même cocotte, fais-les revenir 10 minutes à feu moyen, jusqu'à ce qu'ils soient tendres.",
 "Ajoute l'ail haché et le paprika, mélange 30 secondes, puis les tomates.",
 "Remets le poulet en l'enfonçant dans la sauce. Couvre et laisse mijoter 30 minutes à feu doux.",
 "Lance le riz 15 minutes avant la fin.",
 "Si la sauce est trop liquide, retire le couvercle les 10 dernières minutes. Goûte et rectifie."
],["Le piment d'Espelette remplace très bien le paprika : c'est la vraie touche basque."],"3 jours au frigo, 3 mois au congélateur.");
X("soupe-oignon","Une cocotte, des bols allant au four.",[
 "Épluche les oignons, coupe-les en deux puis en lamelles fines.",
 "Fais fondre le beurre dans la cocotte et ajoute les oignons avec une pincée de sel.",
 "Laisse-les cuire 20 à 25 minutes à feu doux, en remuant régulièrement. Ils doivent devenir fondants et prendre une couleur caramel. C'est l'étape qui fait tout le goût, ne la presse pas.",
 "Saupoudre de farine et mélange 1 minute.",
 "Ajoute le bouillon et environ 400 ml d'eau par personne. Porte à ébullition et laisse frémir 15 minutes. Sale, poivre.",
 "Allume le gril du four. Fais griller les tranches de baguette.",
 "Verse la soupe dans les bols, pose les tranches de pain dessus et couvre généreusement de fromage.",
 "Passe sous le gril 3 à 5 minutes, jusqu'à ce que le fromage soit doré et bouillonnant."
],["Si les oignons accrochent, ajoute une cuillère d'eau et gratte le fond : ces sucs donnent la couleur à la soupe."],"La soupe (sans pain ni fromage) se garde 4 jours au frigo.");
X("gratin-chou-fleur","Une casserole, une petite casserole, un fouet, un plat à gratin.",[
 "Détaille le chou-fleur en bouquets de taille égale.",
 "Fais-les cuire 8 à 10 minutes dans l'eau bouillante salée : ils doivent être tendres mais encore fermes. Égoutte très soigneusement.",
 "Préchauffe le four à 200 °C.",
 "Béchamel : fais fondre le beurre, ajoute la farine et remue 1 minute. Verse le lait froid en fouettant jusqu'à épaississement. Ajoute la moitié du fromage, la muscade, sel et poivre.",
 "Dispose le chou-fleur et le jambon en dés dans le plat.",
 "Nappe de béchamel et parsème du reste de fromage.",
 "Enfourne 20 minutes, jusqu'à ce que le dessus soit bien doré."
],["Le chou-fleur mal égoutté rend de l'eau dans le gratin : laisse-le s'égoutter 5 minutes."],"3 jours au frigo.");
X("pdt-oeufs-plat","Une grande poêle, une petite poêle, une spatule.",[
 "Épluche les pommes de terre (ou garde la peau si elles sont nouvelles) et coupe-les en cubes de 2 cm.",
 "Rince-les et sèche-les bien dans un torchon : sèches, elles dorent mieux.",
 "Chauffe l'huile dans la grande poêle à feu moyen à vif. Ajoute les pommes de terre en une seule couche.",
 "Laisse-les dorer 5 minutes sans toucher, puis remue et poursuis 15 minutes en remuant de temps en temps. Elles doivent être croustillantes dehors et tendres dedans.",
 "Sale, poivre et parsème de persil.",
 "Dans la petite poêle, fais cuire les œufs au plat à feu moyen, 2 à 3 minutes, jusqu'à ce que le blanc soit pris et le jaune encore coulant.",
 "Sers avec la salade."
],["Couvrir la poêle 1 minute à la fin cuit le dessus du blanc sans durcir le jaune."],"À manger tout de suite.");
X("cassoulet","Une cocotte avec couvercle.",[
 "Coupe les saucisses en tronçons de 3 cm.",
 "Fais-les dorer avec les lardons dans la cocotte à feu moyen, 5 minutes.",
 "Ajoute l'oignon haché et l'ail, et poursuis 3 minutes.",
 "Rince et égoutte les haricots, puis ajoute-les avec les tomates et le thym.",
 "Ajoute un demi-verre d'eau, couvre et laisse mijoter 25 minutes à feu doux en remuant de temps en temps.",
 "Goûte et poivre. Pour une croûte comme au four, verse dans un plat, saupoudre de chapelure et passe 10 minutes sous le gril."
],["Une cuisse de canard confite en morceaux en fait un vrai cassoulet de fête."],"4 jours au frigo, 3 mois au congélateur.");
X("boeuf-carottes","Une cocotte avec couvercle.",[
 "Coupe la viande en gros cubes et sèche-la.",
 "Fais-la dorer dans un filet d'huile à feu vif, en plusieurs fois, 2 à 3 minutes par face.",
 "Ajoute l'oignon émincé et fais-le revenir 3 minutes à feu moyen.",
 "Ajoute le concentré de tomate, le bouillon, le thym et le laurier, puis de l'eau à hauteur.",
 "Couvre et laisse mijoter 1 h 30 à feu très doux.",
 "Ajoute les carottes en rondelles épaisses et les pommes de terre en morceaux.",
 "Poursuis 40 minutes, jusqu'à ce que la viande soit fondante et les carottes confites. Laisse réduire la sauce à découvert si besoin."
],["Plus la cuisson est douce et longue, plus la viande est tendre."],"4 jours au frigo, 3 mois au congélateur.");
X("saucisse-puree","Une casserole, une poêle avec couvercle, un presse-purée.",[
 "Épluche les pommes de terre, coupe-les en gros morceaux et cuis-les 20 minutes à l'eau salée.",

 "Ajoute le lait chaud petit à petit jusqu'à la texture voulue. Sale, poivre.",
 "Sers les saucisses et les oignons sur la purée, avec le jus de cuisson."
],["Un peu de moutarde dans la purée, c'est délicieux avec les saucisses."],"2 jours au frigo.");
X("flammekueche","Une plaque de four, du papier cuisson, un bol.",[
 "Préchauffe le four à 240 °C, le plus chaud possible.",
 "Émince l'oignon en lamelles très fines, presque transparentes.",
 "Mélange le fromage blanc et la crème avec du sel, du poivre et une pincée de muscade.",
 "Déroule la pâte sur la plaque et étale-la le plus finement possible au rouleau ou avec les doigts.",
 "Étale le mélange crémeux jusqu'à 1 cm du bord, puis répartis l'oignon et les lardons crus.",
 "Enfourne 12 à 15 minutes, jusqu'à ce que les bords soient bien dorés et croustillants.",
 "Coupe en parts et sers aussitôt."
],["Le secret d'une bonne flammekueche : une pâte très fine et un four très chaud."],"À manger tout de suite.");
X("omelette-champi","Une poêle, une spatule, un bol.",[
 "Nettoie les champignons avec un essuie-tout humide et émince-les.",
 "Fais-les revenir dans la moitié du beurre à feu moyen à vif, 5 minutes, jusqu'à ce qu'ils aient rendu leur eau et commencent à dorer. Sale, poivre, réserve.",
 "Bats les œufs avec le persil, sel et poivre.",
 "Fais fondre le reste du beurre dans la poêle et verse les œufs.",
 "Ramène les bords vers le centre pendant 1 minute, puis répartis les champignons sur une moitié.",
 "Quand le dessus est encore baveux, replie l'omelette et sers avec la salade."
],["Les champignons ne doivent pas être entassés dans la poêle, sinon ils bouillent au lieu de dorer."],"À manger tout de suite.");
X("poelee-pdt-lardons","Une grande poêle avec couvercle.",[
 "Épluche les pommes de terre et coupe-les en cubes de 2 cm. Sèche-les.",
 "Chauffe un filet d'huile à feu moyen et fais dorer les pommes de terre 10 minutes, couvercle posé, en remuant de temps en temps.",
 "Retire le couvercle, ajoute les lardons et l'oignon émincé.",
 "Poursuis 5 minutes, puis ajoute les champignons émincés.",
 "Laisse dorer encore 10 minutes en remuant, jusqu'à ce que tout soit bien doré.",
 "Poivre, goûte avant de saler (les lardons le sont déjà) et parsème de persil."

X("tomates-farcies","Un plat à four, une cuillère, un saladier, une casserole pour le riz.",[

 "Coupe un chapeau sur chaque tomate et creuse l'intérieur avec une cuillère. Garde la pulpe.",
 "Sale l'intérieur des tomates et retourne-les sur une assiette 10 minutes pour qu'elles rendent leur eau.",
 "Retire la peau des saucisses et mélange la chair avec l'oignon, l'ail et le persil hachés finement. Poivre.",
 "Remplis les tomates de farce en tassant, saupoudre de chapelure et remets les chapeaux.",

],["Le riz cuit sous les tomates absorbe tout le jus : c'est le meilleur du plat."],"3 jours au frigo.");
X("courgettes-farcies","Un plat à four, une cuillère, une poêle, une casserole.",[
 "Préchauffe le four à 190 °C et fais précuire le riz 10 minutes.",
 "Coupe les courgettes en deux dans la longueur et creuse-les avec une cuillère en laissant 5 mm de bord. Hache la chair retirée.",
 "Fais revenir l'oignon haché 3 minutes, puis la viande 5 minutes en l'émiettant.",
 "Ajoute la chair de courgette et la moitié des tomates, et laisse réduire 5 minutes. Mélange avec le riz. Sale, poivre.",
 "Remplis les courgettes et range-les dans le plat.",
 "Verse le reste des tomates autour avec un fond d'eau, parsème de fromage.",
 "Enfourne 35 minutes, jusqu'à ce que les courgettes soient tendres."
],["Une pincée d'herbes de Provence dans la farce, et c'est le sud dans l'assiette."],"3 jours au frigo.");
X("salade-lyonnaise","Une poêle, une petite casserole, un saladier, une écumoire.",[

 "Œuf poché : porte de l'eau à frémissement (sans bouillir) avec un trait de vinaigre, sans sel. Casse l'œuf dans une tasse.",
 "Fais tourner l'eau avec une cuillère pour créer un tourbillon et glisse l'œuf au centre. Compte 3 minutes, puis sors-le avec l'écumoire.",
 "Prépare la vinaigrette dans le saladier : moutarde, vinaigre, sel, poivre, puis l'huile.",

],["Un œuf très frais tient mieux à la cuisson pochée.","Si l'œuf poché te fait peur, un œuf mollet (6 minutes) fait très bien l'affaire."],"À manger tout de suite.");
X("pates-saumon","Une casserole, une poêle, une râpe.",[
 "Porte l'eau des pâtes à ébullition et sale-la.",
 "Retire la peau du saumon et coupe-le en cubes de 2 cm.",
 "Fais cuire les tagliatelles selon le temps du paquet.",
 "Dans la poêle, fais cuire le saumon 2 à 3 minutes à feu moyen, juste pour qu'il devienne opaque.",
 "Ajoute la crème, le zeste du citron râpé et un filet de son jus. Laisse chauffer 1 minute.",
 "Égoutte les pâtes en gardant un peu d'eau de cuisson, et verse-les dans la poêle.",
 "Mélange délicatement en ajoutant un peu d'eau de cuisson si c'est trop épais. Poivre et parsème de ciboulette."
],["Ne fais pas trop cuire le saumon : il continue de cuire dans la sauce chaude."],"1 jour au frigo.");
X("veloute-poireaux","Un faitout, un mixeur plongeant.",[
 "Coupe la racine et le vert foncé des poireaux, fends-les, rince-les bien et émince-les.",
 "Fais fondre le beurre dans le faitout et ajoute les poireaux avec une pincée de sel. Laisse-les suer 5 minutes à feu doux, sans colorer.",
 "Ajoute les pommes de terre épluchées et coupées en dés.",
 "Ajoute le bouillon et de l'eau juste à hauteur. Couvre et laisse cuire 20 minutes.",
 "Mixe très finement, ajoute la crème, sale et poivre.",
 "Sers chaud avec du pain, ou bien froid : c'est alors une vichyssoise."
],["Plus c'est mixé longtemps, plus c'est velouté."],"4 jours au frigo, 3 mois au congélateur.");
X("pates-jambon-pois","Une casserole, une passoire.",[
 "Porte l'eau à ébullition et sale-la.",
 "Fais cuire les pâtes. 5 minutes avant la fin de cuisson, ajoute les petits pois surgelés dans la même eau.",
 "Coupe le jambon en lanières.",
 "Garde un fond d'eau de cuisson, puis égoutte pâtes et petits pois.",
 "Remets-les dans la casserole sur feu doux avec la crème, le jambon et le parmesan. Mélange 1 minute.",
 "Ajoute un peu d'eau de cuisson si besoin pour une sauce bien nappante. Poivre et sers."
],["Une pincée de zeste de citron réveille les petits pois."],"2 jours au frigo.");
X("wrap-thon","Un bol, une râpe.",[
 "Égoutte bien le thon et émiette-le dans le bol.",
 "Mélange-le avec le fromage blanc, sel, poivre et, si tu en as, quelques gouttes de citron.",
 "Râpe la carotte et coupe la tomate en petits dés.",
 "Réchauffe les tortillas 10 secondes à la poêle ou au micro-ondes : elles se roulent sans craquer.",
 "Étale le mélange au thon au centre, ajoute la salade, la carotte et la tomate.",
 "Replie le bas de la tortilla, puis roule bien serré. Coupe en deux en biais."
],["Enveloppé dans du papier aluminium, il se transporte très bien."],"À manger dans la journée.");
X("veloute-carottes","Un faitout, un mixeur plongeant.",[
 "Épluche les carottes et la pomme de terre, et coupe-les en rondelles et en dés.",
 "Fais revenir l'oignon émincé dans un filet d'huile 3 minutes, puis ajoute le cumin et remue 30 secondes pour libérer son parfum.",
 "Ajoute les légumes, le bouillon et de l'eau juste à hauteur.",
 "Couvre et laisse cuire 20 minutes, jusqu'à ce que les carottes s'écrasent facilement.",
 "Mixe très finement avec la crème. Sale, poivre.",
 "Sers avec du pain grillé et une pincée de cumin par-dessus."
],["Un peu de gingembre râpé ou de lait de coco change tout."],"4 jours au frigo, 3 mois au congélateur.");

X("carbonara","Une grande casserole, une grande poêle, un bol, une fourchette.",[
 "Porte une grande casserole d'eau à ébullition et sale-la, mais un peu moins que d'habitude : les lardons et le parmesan sont salés.",
 "Dans le bol, bats l'œuf entier et le jaune supplémentaire avec le parmesan et beaucoup de poivre fraîchement moulu. Tu obtiens une crème épaisse.",
 "Fais dorer les lardons dans la poêle à sec, à feu moyen, 5 à 6 minutes, jusqu'à ce qu'ils soient croustillants. Coupe le feu.",
 "Fais cuire les spaghetti 1 minute de moins que le temps indiqué.",
 "Juste avant d'égoutter, prélève une tasse d'eau de cuisson.",
 "Égoutte les pâtes et verse-les dans la poêle des lardons, feu éteint. Mélange 30 secondes pour qu'elles prennent le gras des lardons et refroidissent un peu.",
 "Verse le mélange œuf-parmesan et mélange vivement avec une pince, en ajoutant de l'eau de cuisson petit à petit. La chaleur des pâtes épaissit l'œuf en une sauce crémeuse et brillante.",
 "Si la sauce reste trop liquide, remets 10 secondes sur feu très doux sans arrêter de remuer. Sers aussitôt avec un tour de poivre."
],["La vraie carbonara n'a pas de crème : c'est l'œuf, le fromage et l'eau de cuisson qui font la sauce.","Si l'œuf fait des grumeaux, c'est que la poêle était trop chaude : laisse-la refroidir 1 minute avant."],"À manger tout de suite, elle ne se réchauffe pas bien.");
X("bolognaise","Une sauteuse ou une cocotte, une grande casserole.",[
 "Épluche et hache finement l'oignon, la carotte et l'ail : plus c'est fin, plus la sauce sera fondante.",

 "Monte le feu, ajoute la viande et fais-la bien dorer 5 minutes en l'émiettant. Elle doit perdre sa couleur rose et commencer à colorer.",
 "Ajoute les tomates concassées, l'origan, du sel et du poivre. Rince la boîte avec un fond d'eau et ajoute-le.",
 "Laisse mijoter au moins 25 minutes à feu doux, à demi-couvert, en remuant de temps en temps. Plus elle mijote, meilleure elle est.",

const PHKEY = "popote.photos.v2";
let PH = {};
try { PH = JSON.parse(localStorage.getItem(PHKEY)) || {}; } catch(e) {}
let phBusy = false, phDead = false;
const phWant = new Set();
function savePH(){ try { localStorage.setItem(PHKEY, JSON.stringify(PH)); } catch(e) {} }
function phCandidates(id){
  const s = PHOTOS[id]; if (!s) return [];
  return s.split("|").map(x => { const i = x.indexOf(":"); return {lang:x.slice(0,i), title:x.slice(i+1)}; });
}
function photoSrc(r){ if (r.photo) return r.photo; const p = PH[r.id]; return p && p.src ? p.src : ""; }
function bigSrc(src){ return src.replace(/\/(\d+)px-/, "/960px-"); }
function photo(r, cls){
  const src = photoSrc(r), hero = (cls||"").includes("hero");
  const dead = !src && (phDead || (PH[r.id] && PH[r.id].none));
  const img = src ? '<img src="' + esc(hero ? bigSrc(src) : src) + '" data-small="' + esc(src) + '" alt="" decoding="async"' + (hero ? "" : ' loading="lazy"') + ">" : "";
  return '<span class="ph ' + (cls||"") + (dead ? " noimg" : "") + '" data-pid="' + esc(r.id) + '"><span class="ph-fb" aria-hidden="true">' + (src ? "" : esc(r.e)) + "</span>" + img + "</span>";
}
function paintPhoto(id){
  const r = RBYID[id]; if (!r) return;
  const src = photoSrc(r);
  document.querySelectorAll(".ph[data-pid]").forEach(el => {
    if (el.dataset.pid !== id) return;
    if (!src){ el.classList.add("noimg"); return; }
    if (el.querySelector("img")) return;
    const img = document.createElement("img");
    const hero = el.classList.contains("hero");
    img.alt = ""; img.decoding = "async"; img.dataset.small = src; img.src = hero ? bigSrc(src) : src;
    el.appendChild(img);
  });

}
function hydrate(){
  document.querySelectorAll(".ph[data-pid]").forEach(el => {
    const id = el.dataset.pid, r = RBYID[id]; if (!r || r.photo) return;
    const p = PH[id];
    if (p && p.src){ if (!el.querySelector("img")) paintPhoto(id); }
    else if (!p || (p.none && Date.now() - p.t > 7*864e5)) phWant.add(id);
  });
  if (phWant.size && !phBusy && !phDead) resolvePhotos();
}
async function wikiQuery(lang, params){
  const ctl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const tm = ctl ? setTimeout(() => ctl.abort(), 10000) : 0;
  try {
    const res = await fetch("https://" + lang + ".wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&" + params, ctl ? {signal:ctl.signal} : {});
    if (!res.ok) throw new Error("http " + res.status);
    return await res.json();
  } finally { if (tm) clearTimeout(tm); }
}
async function pageImages(lang, titles){
  const j = await wikiQuery(lang, "redirects=1&prop=pageimages&piprop=thumbnail%7Cname&pithumbsize=500&titles=" + encodeURIComponent(titles.join("|")));
  const q = j.query || {}, map = {}, out = {};
  for (const pg of (q.pages || [])) if (pg.thumbnail && pg.thumbnail.source && pg.pageimage) map[pg.title] = {src:pg.thumbnail.source, file:pg.pageimage};
  for (const t of titles){
    let cur = t;
    for (const n of (q.normalized || [])) if (n.from === cur) cur = n.to;
    for (const r of (q.redirects || [])) if (r.from === cur) cur = r.to;
    if (map[cur]) out[t] = map[cur];
  }
  return out;
}
const STOPW = new Set(["avec","pour","sauce","façon","facon","maison","aux","des","les","une","dans","plat"]);
const normW = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
async function searchImage(r){
  const words = normW(r.n).split(/[^a-z]+/).filter(w => w.length >= 4 && !STOPW.has(w));
  if (!words.length) return null;
  const j = await wikiQuery("fr", "generator=search&gsrlimit=3&gsrnamespace=0&prop=pageimages&piprop=thumbnail%7Cname&pithumbsize=500&gsrsearch=" + encodeURIComponent(r.n));
  const pages = ((j.query && j.query.pages) || []).sort((a,b) => (a.index||0) - (b.index||0));
  for (const pg of pages){
    if (!pg.thumbnail || !pg.pageimage) continue;
    const t = normW(pg.title);
    if (words.some(w => t.includes(w.slice(0, Math.max(4, w.length - 2))))) return {src:pg.thumbnail.source, file:pg.pageimage, lang:"fr"};
  }
  return null;
}
async function resolvePhotos(){
  phBusy = true;
  try {
    while (phWant.size){
      const ids = [...phWant]; phWant.clear();
      let pending = ids.map(id => ({id, k:0}));
      while (pending.length){
        const groups = {}, next = [], noCand = [];
        for (const p of pending){
          const c = phCandidates(p.id)[p.k];
          if (!c){ noCand.push(p.id); continue; }
          (groups[c.lang] = groups[c.lang] || []).push(p);
        }
        for (const lang in groups){
          const list = groups[lang];
          for (let i = 0; i < list.length; i += 25){
            const chunk = list.slice(i, i+25);
            const found = await pageImages(lang, [...new Set(chunk.map(p => phCandidates(p.id)[p.k].title))]);
            for (const p of chunk){
              const f = found[phCandidates(p.id)[p.k].title];
              if (f){ PH[p.id] = {src:f.src, file:f.file, lang}; paintPhoto(p.id); }
              else next.push({id:p.id, k:p.k+1});
            }
          }
        }
        for (const id of noCand){
          const r = RBYID[id]; const f = r ? await searchImage(r) : null;
          PH[id] = f || {none:true, t:Date.now()};
          paintPhoto(id);
        }
        pending = next;
      }
      savePH();
    }
  } catch(e) {
    phDead = true;
    document.querySelectorAll(".ph[data-pid]").forEach(el => { if (!el.querySelector("img")) el.classList.add("noimg"); });
  }
  phBusy = false;
}
async function loadCredit(id){
  const p = PH[id];
  if (p && p.file && !p.credit){
    try {
      const j = await wikiQuery(p.lang, "prop=imageinfo&iiprop=extmetadata&iiextmetadatafilter=Artist%7CLicenseShortName&titles=" + encodeURIComponent("File:" + p.file));
      const pg = ((j.query && j.query.pages) || [])[0];
      const md = (pg && pg.imageinfo && pg.imageinfo[0] && pg.imageinfo[0].extmetadata) || {};
      const strip = h => h ? new DOMParser().parseFromString(h, "text/html").body.textContent.replace(/\s+/g," ").trim() : "";
      p.credit = {a:strip(md.Artist && md.Artist.value).slice(0,80), l:(md.LicenseShortName && md.LicenseShortName.value) || ""};
      savePH();
    } catch(e) {}
  }
  const el = document.getElementById("credit");
  if (!el || el.dataset.cid !== id || !p || !p.src) return;
  const c = p.credit || {};
  el.innerHTML = "Photo : " + (c.a ? esc(c.a) + " · " : "") + (c.l ? esc(c.l) + " · " : "") +
    '<a href="https://' + p.lang + ".wikipedia.org/wiki/File:" + encodeURIComponent(p.file) + '" target="_blank" rel="noopener">Wikimedia Commons</a>';
}

/* ════════════ Mouvement ════════════ */
const REDUCED = typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches;
// Ressort façon Apple : « response » (s) et amortissement (1 = sans rebond). Part de la valeur actuelle et garde la vitesse.
function spring(from, to, opt, onStep, onDone){
  let x = from, v = opt.velocity || 0, last = performance.now(), raf = 0, stopped = false;
  const T = opt.response || 0.4, z = opt.damping == null ? 1 : opt.damping;
  const k = Math.pow(2*Math.PI/T, 2), c = 4*Math.PI*z/T;
  function step(now){
    if (stopped) return;
    const dt = Math.min(0.034, (now - last)/1000); last = now;
    for (let i = 0; i < 4; i++){ const h = dt/4; v += (-k*(x - to) - c*v)*h; x += v*h; }
    if (Math.abs(x - to) < 0.4 && Math.abs(v) < 8){ onStep(to); if (onDone) onDone(); return; }
    onStep(x); raf = requestAnimationFrame(step);
  }
  if (REDUCED){ onStep(to); if (onDone) onDone(); return {stop(){}, get value(){ return to; }}; }
  raf = requestAnimationFrame(step);
  return {stop(){ stopped = true; cancelAnimationFrame(raf); }, get value(){ return x; }, get velocity(){ return v; }};
}
const project = (v, d = 0.998) => (v/1000) * d / (1 - d);
const rubber = (o, dim, c = 0.55) => (o*dim*c) / (dim + c*Math.abs(o));
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms || 8); } catch(e) {} }
function animateNum(el, from, to){
  if (!el) return;
  if (REDUCED || from == null || Math.abs(from - to) < 0.005){ el.textContent = eur(to); return; }
  const t0 = performance.now(), d = 650;
  (function f(now){ const p = Math.min(1, (now - t0)/d), e = 1 - Math.pow(1-p, 3); el.textContent = eur(from + (to-from)*e); if (p < 1) requestAnimationFrame(f); })(t0);
}

}

// Insère les quantités (calculées pour « mult » personnes ou portions) à la première mention de chaque ingrédient
function annotateSteps(r, steps, mult){
  const used = new Set();
  return steps.map(raw => {
    let s = raw.replace(/(environ )?(\d+)\s*ml ((?:d'eau|de lait)[^.,;]*?) par personne/g, (m0, env, n, what) => (env || "") + "\u0001" + fmtWater(+n*mult) + "\u0002 " + what);
    for (const [k, q] of r.i){
      if (used.has(k) || k === "eau" || !KWRE[k]) continue;
      const m = KWRE[k].exec(s);
      if (!m) continue;
      const after = s.slice(m.index + m[0].length);
      if (/^\s*\(/.test(after) || /^[^.:;]{0,30}(?:sont|est) (?:déjà )?salée?s?/.test(after)) continue;
      used.add(k);
      s = s.slice(0, m.index + m[0].length) + " \u0003" + qtyLabel(k, q*mult) + "\u0004" + after;
    }
    return esc(s).replace(/\u0001/g, '<b class="qt">').replace(/\u0002/g, "</b>").replace(/\u0003/g, '<b class="qt">(').replace(/\u0004/g, ")</b>");
  });
}
// Mise en place : ce qu'il faut préparer avant d'allumer le feu
const PEEL = new Set(["oignon","oignon_r","echalote","ail","carotte","pdt","patate_douce","gingembre","courge","banane","avocat"]);
const HERBS = new Set(["coriandre","persil","basilic","menthe","ciboulette","cebette"]);
function prepVerb(k){
  const g = I[k];
  if (g.r === "fl"){ if (PEEL.has(k)) return "À éplucher"; if (HERBS.has(k)) return "À laver et sécher"; if (k === "champignon") return "À nettoyer"; return "À laver"; }
  if (k === "colin" || k === "crevette") return "À décongeler (la veille au frigo)";
  if (g.r === "sg") return "À sortir du congélateur au moment de cuire";
  if (g.r === "vi" || g.r === "po" || g.r === "cr") return "À sortir du frigo";
  return "À peser ou mesurer";
}
function miseEnPlace(entries){
  const rows = [], staples = [];
  for (const [k, q] of entries){
    const g = I[k]; if (!g || k === "eau") continue;
    if (g.fl.includes("S")){ staples.push(g.n.toLowerCase()); continue; }
    rows.push({k, q, verb:prepVerb(k)});
  }
  const order = ["À décongeler (la veille au frigo)","À éplucher","À laver","À nettoyer","À laver et sécher","À sortir du frigo","À sortir du congélateur au moment de cuire","À peser ou mesurer"];
  rows.sort((a,b) => order.indexOf(a.verb) - order.indexOf(b.verb));
  return {rows, staples};
}

/* ════════════ Batch cooking ════════════ */
function batchInfo(r){
  const D = typeof DETAILS !== "undefined" ? DETAILS[r.id] : null, k = (D && D.keep) || "";
  const m = k.match(/(\d+)\s*jours?\s*au frigo/);
  const fridge = m ? +m[1] : 0, freeze = /congélateur/.test(k) && !/sans/.test(k.split("congélateur")[0].slice(-20));
  return {fridge, freeze, ok:fridge >= 3 || freeze};
}
function generateBatchWeek(){
  rebuild();
  const slots = buildSlots(S.days, S.meals);
  const mains = slots.map((s,i) => ({...s, i})).filter(s => s.m !== "P");
  if (!mains.length){ toast("Coche le déjeuner ou le dîner dans les réglages."); return false; }
  const cand = RX.filter(r => r.m !== "P" && (r.m.includes("M") || r.m.includes("S")) && allowed(r) && batchInfo(r).ok);
  if (cand.length < 3){ toast("Pas assez de plats qui se conservent avec tes filtres."); return false; }
  const n = mains.length, K = Math.max(2, Math.min(6, Math.round(n/3), cand.length));
  const counts = Array.from({length:K}, (_, j) => Math.floor(n/K) + (j < n % K ? 1 : 0));
  const recent = recentMap(true), favs = new Set(S.favs);
  const pref = {}; cand.forEach(r => pref[r.id] = Math.random());
  function score(set){
    const ids = []; set.forEach((r, j) => { for (let c = 0; c < counts[j]; c++) ids.push(r.idx); });
    const C = totalFor(ids, S.people, true);
    let E = 0.3*C + (C > S.budget ? 8*(C - S.budget) + 5 : 0);
    const cu = {}, pt = {};
    for (const r of set){ cu[r.c] = (cu[r.c]||0) + 1; pt[r.prot] = (pt[r.prot]||0) + 1; if (recent[r.id]) E += 3; if (favs.has(r.id)) E -= 1; E -= 2*pref[r.id]; if (!batchInfo(r).freeze) E += 0.6; }
    for (const k in cu) if (cu[k] > 1) E += 2.5*(cu[k]-1);
    const words = set.map(r => new Set(normW(r.n).split(/[^a-z]+/).filter(x => x.length >= 5)));
    for (let a = 0; a < set.length; a++) for (let b = a+1; b < set.length; b++) for (const x of words[a]) if (words[b].has(x)) { E += 3; break; }
    for (const k in pt) if (pt[k] > 1) E += 2*(pt[k]-1);
    return {E, C};
  }
  const pick = () => cand[(Math.random()*cand.length)|0];
  let best = null, bestS = null;
  for (let t = 0; t < 300; t++){
    const set = []; while (set.length < K){ const r = pick(); if (!set.includes(r)) set.push(r); }
    const sc = score(set); if (!best || sc.E < bestS.E){ best = set; bestS = sc; }
  }
  for (let t = 0; t < 600; t++){
    const set = best.slice(), j = (Math.random()*K)|0; const r = pick(); if (set.includes(r)) continue; set[j] = r;
    const sc = score(set); if (sc.E < bestS.E){ best = set; bestS = sc; }
  }
  // Répartition : les plats qui se congèlent mal en début de semaine, jamais deux fois de suite
  const left = best.map((r, j) => ({r, c:counts[j], info:batchInfo(r)}));
  const assign = [];
  let prev = null;
  for (const sl of mains){
    const day = sl.d + 1;
    const ok = left.filter(x => x.c > 0 && (x.info.freeze || day <= x.info.fridge));
    let pool = ok.filter(x => x.r !== prev); if (!pool.length) pool = ok.length ? ok : left.filter(x => x.c > 0);
    pool.sort((a,b) => (a.info.freeze - b.info.freeze) || (b.c - a.c));
    const x = pool[0]; x.c--; prev = x.r; assign.push(x.r.id);

  const old = S.week;
  if (old && (old.done || old.start < addDaysISO(todayISO(), -4))) pushHistory(old);
  const pPool = poolFor("P").map(i => RX[i]);
  const pList = shuffleWithSeed(pPool, (Math.random()*1000)|0);
  let a = 0, pb = 0;
  S.week = {start:todayISO(), days:S.days, batch:true, minCost:null, done:false,
    slots:slots.map(s => ({d:s.d, m:s.m, id: s.m === "P" ? (pList.length ? pList[(pb++) % pList.length].id : "porridge-banane") : assign[a++]}))};
  if (bestS.C > S.budget + 0.01) S.week.minCost = bestS.C;
  S.checked = {}; S.batchDone = {};
  save();
  return true;
}
function batchPlan(){

const ICO3 = {play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l11-6.5a1 1 0 0 0 0-1.72l-11-6.5A1 1 0 0 0 8 5.5Z"/></svg>', batch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/><rect x="8" y="4" width="8" height="7" rx="1.5"/><path d="M5 13v-1M19 13v-1"/></svg>', timer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 2M9.5 2.5h5M12 2.5V6"/></svg>'};
function timerOf(s){
  let m = s.match(/(\d+)\s*h(?:eures?)?\s*(\d+)?/);
  if (m && /\d+\s*h(\s|eure|\d|$)/.test(m[0] + " ")) return (+m[1])*60 + (+(m[2]||0));
  m = s.match(/(\d+)\s*(?:à\s*\d+\s*)?minutes?/);
  return m && +m[1] >= 2 ? +m[1] : 0;
}
const TM = {end:0, label:"", int:0};
function beep(){
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = new C();
    [0, 0.35, 0.7].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + t + 0.25);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3); });
  } catch(e) {}
}
function timerTick(){
  const el = document.getElementById("timerPill"); if (!el) return;
  const left = Math.max(0, Math.round((TM.end - Date.now())/1000));
  if (!TM.end){ el.hidden = true; return; }
  el.hidden = false;
  el.querySelector(".tp-t").textContent = Math.floor(left/60) + ":" + String(left%60).padStart(2,"0");
  el.querySelector(".tp-l").textContent = TM.label;
  if (left <= 0){ clearInterval(TM.int); TM.end = 0; el.hidden = true; beep(); buzz([200,100,200]); toast("Minuteur terminé : " + TM.label); }
}
function startTimer(min, label){
  clearInterval(TM.int); TM.end = Date.now() + min*60000; TM.label = label;
  TM.int = setInterval(timerTick, 500); timerTick(); buzz(10);
  toast("Minuteur lancé : " + timeLabel(min));
}

const SH = {root:null, panel:null, scrim:null, y:0, H:0, anim:null, open:false};
function setSheetY(y){
  SH.y = y; if (!SH.panel) return;
  SH.panel.style.transform = "translate3d(0," + y.toFixed(2) + "px,0)";
  const p = Math.max(0, Math.min(1, 1 - y/SH.H));
  SH.scrim.style.opacity = (0.35*p).toFixed(3);
  const st = $("#stage");
  if (st){ st.style.transform = p > 0.001 ? "translate3d(0," + (p*10).toFixed(2) + "px,0) scale(" + (1 - 0.065*p).toFixed(4) + ")" : ""; st.style.borderRadius = (12*p).toFixed(1) + "px"; }
}
function sheetTo(y, opt, done){ if (SH.anim) SH.anim.stop(); SH.anim = spring(SH.y, y, opt || {}, setSheetY, () => { SH.anim = null; if (done) done(); }); }
function openSheet(title, body, st, hero, white){
